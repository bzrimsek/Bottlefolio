/* ====================================================================
   THE AUTOMATIC INTAKE
   ==================================================================== */

/* ---- offerRows   index.html 48247-48266 ---- */
function offerRows(snap) {
  const rows = [];
  snap.forEach(who => {
    who.forEach(c => {
      /* `upc` IS NOT AN OFFER: it holds the contributor's barcode pairings.
         Read as an offer it has no name, sorts into "adds nothing", and can
         never be cleared, because the rules refuse any non-twelve-digit key
         under `upc`. */
      if (c.key === 'upc') return;
      const v = c.val() || {};
      rows.push({ uid: who.key, slug: c.key, entry: v, unreadable: !v.name });
    });
  });
  return rows;
}

/* THE LIBRARY, READ FRESH, OR NOTHING IS JUDGED. LIB.products is null until
   somebody opens the library, and against an empty library every offer is
   new - so an automatic add would write over an existing entry. It reads
   the library and removals itself every time, and stops rather than guess. */

/* ---- intakeVetSoon   index.html 48229-48246 ---- */
async function intakeVetSoon() {
  /* Not gated on the budget or the service: clearing what adds nothing and
     adding what is complete cost nothing, and the lookups check the budget
     one at a time. Answers false when it did not run, so a press can say so. */
  if (VETTING || !A.admin || !A.user) return false;
  VETTING = true;
  try {
    await intakeVetRun();
  } catch (e) {
    appLog('vetting stopped: ' + ((e && e.message) || e));
  } finally {
    VETTING = false;
  }
  return true;
}

/* THE OFFERS, AS ROWS, in one place, so "skip the barcode node" is not
   copied (a copy that missed it made an unclearable row). */

/* ---- intakeVetRun   index.html 48304-48324 ---- */
async function intakeVetRun() {
  await intakeAcceptUpcs().catch(e => appLog('barcodes: offers not taken \u2014 '
    + ((e && e.message) || e)));
  const rows = (await readOffers()).filter(r => !r.entry.dropped);
  if (!rows.length) return;
  const lib = await intakeReadLibrary();
  if (!lib) return;
  const opts = A.L.intakeReady({ library: lib.library, removed: lib.removed,
    graves: LIB.graves, ref: lib.ref });
  const work = A.L.intakeWork(rows, opts);
  const cleared = await intakeClearNothing(work.nothing);
  const ran = await intakeVetLookups(work.todo, opts);
  const added = await intakeAutoAdd(opts, lib.removed);
  /* COUNTED FROM THE WRITES, not the intentions, so a refused write does not
     look like progress and trigger another run. */
  intakeVetReport(ran.spent, cleared + ran.wrote + added);
}

/* BARCODE OFFERS, ACCEPTED ON THEIR OWN (BZ, 2026-09-16). A code the shared
   list does not have goes in; one it already has is kept as it is. Either
   way the offer is cleared, in one write. Only the fields the rules allow. */

/* ---- intakeReadLibrary   index.html 48267-48282 ---- */
async function intakeReadLibrary() {
  const library = A.L.libraryFromValue((await libRef().once('value')).val());
  if (!Object.keys(library).length) {
    appLog('vetting: the library read came back empty, so nothing was '
      + 'judged or added');
    return null;
  }
  const removed = (await ref(NODE.removed).once('value')).val() || {};
  return { library: library, removed: removed, ref: await libraryRefLoad() };
}

/* WHERE THIS APP KEEPS ITS VERDICTS ON OFFERS - under `shared`, which only
   an admin may write. Never on the offer itself: that is the contributor's
   node, and a verdict written there by them would be acted on unjudged,
   writing an entry of their choosing over any library bottle. (Security.) */

/* ---- readOffers   index.html 48291-48303 ---- */
async function readOffers() {
  const got = await Promise.all([contribRef().once('value'),
    intakeStoreRef().once('value').catch(() => null)]);
  const verdicts = (got[1] && got[1].val()) || {};
  return offerRows(got[0]).map(r => {
    const entry = Object.assign({}, r.entry);
    delete entry.vetted;
    const v = (verdicts[r.uid] || {})[r.slug];
    if (v) entry.vetted = v;
    return Object.assign({}, r, { entry: entry });
  });
}


/* ---- intakeStoreRef   index.html 48283-48290 ---- */
function intakeStoreRef() {
  return ref(NODE.intake);
}

/* THE OFFERS, WITH ONLY THE VERDICTS THIS APP WROTE. Whatever sits in an
   offer's own `vetted` field is the contributor's and is thrown away here;
   the verdict, if any, comes from the admin-only store, and A.L.intakeVetted
   still checks it was made about this offer as it now stands. */

/* ---- intakeAcceptUpcs   index.html 48325-48358 ---- */
async function intakeAcceptUpcs() {
  const got = await Promise.all([contribRef().once('value'),
    ref(NODE.upc).once('value')]);
  const shared = got[1].val() || {};
  const ups = {};
  let took = 0, known = 0;
  got[0].forEach(who => {
    const codes = who.child('upc').val() || {};
    Object.keys(codes).forEach(code => {
      const row = codes[code] || {};
      if (!shared[code] && row.name) {
        const take = { name: row.name, at: row.at || Date.now() };
        if (typeof row.price === 'number') take.price = row.price;
        if (typeof row.size === 'string') take.size = row.size;
        ups['upc/' + code] = take;
        shared[code] = take;
        took++;
      } else {
        known++;
      }
      ups['contrib/' + who.key + '/upc/' + code] = null;
    });
  });
  if (!Object.keys(ups).length) return 0;
  await ref(NODE.root).update(ups);
  appLog('barcodes: took ' + took + ' offered, ' + known
    + ' already known or unnamed');
  return took;
}

/* WHAT ADDS NOTHING IS NOT A DECISION (BZ, 2026-09-15). An offer already
   in the library, removed, or merged away: the verdict IS the reason.
   Dropped, not deleted: held a fortnight with the reason on it, and a Put
   back undoes the lot. */

/* ---- intakeClearNothing   index.html 48359-48375 ---- */
async function intakeClearNothing(list) {
  if (!list.length) return 0;
  appLog('vetting: clearing ' + list.length + ' offer(s) that add nothing');
  const res = await Promise.all(list.map(x => contribRef().child(x.row.uid)
    .child(x.row.slug).child('dropped')
    .set({ why: x.verdict.why || x.verdict.rule || 'nothing to add',
      at: Date.now() })
    .then(() => true)
    .catch(e => {
      appLog('vetting: could not clear ' + (x.row.entry.name || '')
        + ' \u2014 ' + ((e && e.message) || e));
      return false;
    })));
  return res.filter(Boolean).length;
}

/* ONE LOOKUP PER OFFER THAT NEEDS ONE, until the budget says stop. */

/* ---- intakeVetLookups   index.html 48376-48420 ---- */
async function intakeVetLookups(todo, opts) {
  const today = A.L.todayISO();
  let spent = 0, wrote = 0;
  for (let i = 0; i < todo.length; i++) {
    const x = todo[i];
    let v = x.verdict;
    const ask = A.L.intakeAsks(v);
    const gaps = (v.verdict === 'fill' && (v.needs || []).length)
      ? v.needs : null;
    if ((ask || gaps) && A.lookupUrl) {
      if (A.L.intakeBudgetLeft(A.intakeTally, today, A.budget,
          A.tally) <= 0) {
        appLog('vetting: stopped at the budget of '
          + A.L.intakeBudgetOf(A.budget) + ' with ' + (todo.length - i)
          + ' still to look at');
        break;
      }
      const name = (v.product || {}).name || x.row.entry.name || '';
      /* UNDEFINED MEANS THE LOOKUP FAILED, which is not an answer
         (A.L.intakeAfterLookup): nothing is settled, nothing is marked tried,
         and the offer is asked again next run. Offline, the run stops. */
      let got;
      try {
        const raw = await adminService(name, A.L.INTAKE_LOOKUP_MS,
          gaps || undefined);
        A.intakeTally = A.L.countIntake(A.intakeTally, today);
        spent++;
        got = raw ? A.L.parseLookup(raw, { name: name }) : null;
      } catch (e) {
        appLog('  vetting ' + name.slice(0, 34) + ' \u2014 '
          + A.L.lookupFailSay(e));
        if (navigator.onLine === false) break;
      }
      if (got === undefined && !x.write) continue;
      v = A.L.intakeAfterLookup(v, got, opts);
    }
    if (await intakeVetWrite(x.row, v)) wrote++;
  }
  return { spent: spent, wrote: wrote };
}

/* AND WHAT IS READY GOES IN, WITHOUT A PRESS (BZ, 2026-09-16). Read back
   through the plan so two offers of one bottle are one row, written through
   the Add press's writer, each stamped `autoIn` so it can be listed and
   taken back for a fortnight. */

/* ---- intakeAutoAdd   index.html 48421-48447 ---- */
async function intakeAutoAdd(opts, removed) {
  const rows = (await readOffers()).filter(r => !r.entry.dropped);
  const plan = A.L.intakePlan(rows, opts);
  const ready = plan.in.concat(plan.fill).filter(A.L.intakeReadyToAdd);
  if (!ready.length) return 0;
  /* MOVED, for the reason contribAddMany gives: no shelf here to enrich
     from, so an offer is added as it stands. */
  const w = A.L.intakeToWrite(ready, removed, LIB.graves, null,
    Date.now(), true, opts.library);
  /* AN OFFER THAT CAN NEVER GO IN IS CLEARED, not refused again on every
     run: already in the library, removed, merged away. */
  await intakeClearNothing(w.refused.filter(r => r.row).map(r => {
    appLog('vetting: not adding ' + r.name + ' \u2014 ' + r.why);
    return { row: r.row, verdict: { why: r.why } };
  }));
  if (!Object.keys(w.pending).length) return 0;
  try {
    const res = await libraryAddWrite(w.pending, ready, removed, LIB.graves,
      opts.library);
    if (res.added) {
      appLog('vetting: ' + res.added + ' went into the library on their own');
    }
    return res.added;
  } catch (e) {
    appLog('vetting: could not add \u2014 ' + ((e && e.message) || e));
    return 0;
  }
}


/* ---- intakeVetReport   index.html 48448-48463 ---- */
function intakeVetReport(spent, wrote) {
  if (!spent && !wrote) return;
  appLog('vetting: ' + wrote + ' offer(s) settled, ' + spent
    + ' lookup(s) spent of a ' + A.L.intakeBudgetOf(A.budget) + ' budget');
  adminSave();
  /* REDRAWN ONLY IF IT CHANGED SOMETHING, only if the queue is on screen,
     and never over a sheet or another run: a background redraw mid-action
     loses the user's modal. */
  /* MOVED: the app asked whether its library screen was on top and whether
     a modal was open. Here the surface the vetting changes is the Offered
     section, and the modal is #modalWrap. */
  const scr = $('#sec-offers');
  const sheet = $('#modalWrap');
  if (scr && scr.classList.contains('on') && (!sheet || sheet.hidden)
      && !LIB.filling) {
    renderLibraryScreen();
  }
  countOffers();
}

/* WRITTEN DOWN, so nobody pays for this answer twice. */

/* ---- intakeVetWrite   index.html 48464-48481 ---- */
function intakeVetWrite(row, v) {
  /* Into the admin-only store, signed with the offer it is about. `needs`
     stays a list; saved as text it crashed the second pass. */
  const rec = JSON.parse(JSON.stringify({ at: Date.now(),
    sig: A.L.offerSig(row.entry), verdict: v.verdict, rule: v.rule || '',
    why: v.why || '', field: v.field || '', tried: !!v.tried,
    needs: v.needs || [], near: v.near || null, product: v.product || null }));
  return intakeStoreRef().child(row.uid).child(row.slug)
    .set(A.L.fbEncode(rec))
    .then(() => true)
    .catch(e => {
      appLog('vetting write failed: ' + ((e && e.message) || e));
      return false;
    });
}

/* The piles that need no decision stay readable, folded, so "104 go in" is
   not taken on trust. */

/* ---- contribFillFirst   index.html 48802-48846 ---- */
async function contribFillFirst(pending, thin) {
  const today = A.L.todayISO();
  let filled = 0, empty = 0, stopped = 0;
  for (let i = 0; i < thin.length; i++) {
    const x = thin[i];
    /* The day's ceiling stops the run rather than failing a bottle: the
       rest go in as they are and keep their place on the fill list. */
    if (!A.L.lookupAllowed(A.tally, today)) { stopped = thin.length - i; break; }
    let raw = null;
    try {
      raw = await adminService(x.name, A.L.INTAKE_LOOKUP_MS, x.missing);
    } catch (e) {
      appLog('  intake fill ' + x.name.slice(0, 34) + ' \u2014 '
        + A.L.lookupFailSay(e));
      continue;
    }
    const got = A.L.parseLookup(raw, { name: x.name });
    const closes = A.L.gapsClosed(got, x.missing);
    appLog('  intake fill ' + x.name.slice(0, 34) + ' | short of '
      + x.missing.join(',') + ' | '
      + (closes.length ? 'FILLED ' + closes.join(',') : 'nothing came back'));
    if (!closes.length) {
      empty++;
      A.ledger = A.L.recordLookup(A.ledger, x.k, 'empty', today);
      continue;
    }
    const built = A.L.libraryFillWrite([{ k: x.k, name: x.name, got: got,
      missing: x.missing }], { [x.k]: true }, pending, Date.now());
    /* Applied to the rows about to be written, exactly as the fill run
       applies them to its own snapshot. */
    Object.keys(built.updates || {}).forEach(p2 => {
      const bits = p2.split('/');
      if (bits[1] && pending[bits[0]]) {
        pending[bits[0]][bits[1]] = built.updates[p2];
      }
    });
    filled++;
    A.ledger = A.L.recordLookup(A.ledger, x.k, 'found', today);
  }
  return { filled: filled, empty: empty, stopped: stopped };
}

/* ONE WRITE FOR A BATCH, and the offers it settles removed. Shared by the
   Add press and the automatic sorting, so they cannot write different
   things. */

/* ---- libraryAddWrite   index.html 48847-48885 ---- */
function libraryAddWrite(pending, list, removed, graves, library) {
  const updates = {};
  Object.keys(pending).forEach(k => {
    /* ASKED AT THE MOMENT OF WRITING, whatever the caller checked, with the
       truth about whether the entry exists - or an offer could be written
       over an existing bottle whole. */
    const exists = !!(library && (library[k]
      || A.L.alreadyNamed(library, pending[k].name)));
    if (!A.L.libraryAccepts(k, exists, removed, graves).ok) return;
    updates['catalog/products/' + k] = pending[k];
  });
  const keys = Object.keys(updates);
  if (!keys.length) return Promise.resolve({ added: 0, uncleared: 0 });
  updates.stamp = Date.now();
  /* THE OFFERS THAT WENT IN LEAVE THE QUEUE, and the ones merged into them,
     or those would go in alone on the next run. */
  const rows = [];
  (list || []).forEach(x => {
    const p = x.product || {};
    if (keys.indexOf('catalog/products/' + A.L.libKey(p.name || '')) < 0) return;
    if (x.row) rows.push(x.row);
    (x.absorbed || []).forEach(r => rows.push(r));
  });
  return ref(NODE.shared)
    .update(A.L.fbEncodePaths(updates))
    .then(() => Promise.all(rows.map(r => Promise.all([
      contribRef().child(r.uid).child(r.slug).remove(),
      intakeStoreRef().child(r.uid).child(r.slug).remove()
    ]).then(() => true).catch(e => {
      appLog('library: added, but could not clear the offer ' + r.uid + '/'

/* TAKE ENTRIES OUT OF THE LIBRARY. Deleted, and recorded as removed - with
   the entry itself, so Put back restores it - or the automatic paths would
   write it straight back. */

/* ---- libraryTakeOut   index.html 48565-48599 ---- */
function libraryTakeOut(list, btn, why) {
  const done = btn ? buttonWorking(btn, 'Taking out\u2026') : () => {};
  const updates = {};
  const at = Date.now();
  list.forEach(p => {
    const key = p._key || A.L.libKey(p.name);
    const entry = Object.assign({}, p);
    delete entry._key;
    updates['catalog/products/' + key] = null;
    updates['removed/' + key] = { at: at, by: (A.user || {}).uid || '',
      why: why, entry: entry };
  });
  updates.stamp = at;
  ref(NODE.shared)
    .update(A.L.fbEncodePaths(updates))
    .then(() => {
      list.forEach(p => {
        const key = p._key || A.L.libKey(p.name);
        if (LIB.products) delete LIB.products[key];
        LIB.removed = Object.assign({}, LIB.removed || {},
          { [key]: updates['removed/' + key] });
      });
      appLog('library: took out ' + list.length + ' \u2014 ' + why);
      toast(list.length + (list.length === 1 ? ' entry' : ' entries')
        + ' taken out');
      renderLibraryScreen();
    })
    .catch(e => { done(); toast(sayError(e)); });
}

function libraryPutBack(list, btn) {
  const done = buttonWorking(btn, 'Putting back\u2026');
  const ups = {};
  const at = Date.now();
  list.forEach(x => {
    if (x.rec.entry && x.rec.entry.name) {
      ups['catalog/products/' + x.key] = Object.assign({}, x.rec.entry, { at: at });

    .update(A.L.fbEncodePaths(ups))
    .then(() => {

      renderLibraryScreen();

/* MERGE DUPLICATE ENTRIES: the dropped key is deleted and recorded as
   merged into the one kept, on this device (LIB.graves, through buryKey,
   which refuses a round trip) and for everybody (renamed). One writer for
   the per-pair merge and the identical-pairs merge; the per-pair one skipped
   the device's record. fbEncodePaths encodes each segment itself. */

/* ---- libraryMergeWrite   index.html 48630-48648 ---- */
function libraryMergeWrite(pairs) {
  const ups = {};
  pairs.forEach(d => {
    ups['catalog/products/' + d.drop] = null;
    LIB.graves = A.L.buryKey(LIB.graves, d.drop, d.keep);
    ups['renamed/' + d.drop] = { to: A.L.mergedInto(LIB.graves, d.keep),
      at: Date.now() };
    appLog('merge: dropping ' + d.drop + ' into ' + d.keep
      + ' (in library: ' + !!(LIB.products || {})[d.drop] + ')');
  });
  ups.stamp = Date.now();
  return ref(NODE.shared)
    .update(A.L.fbEncodePaths(ups))
    .then(() => {
      pairs.forEach(d => { if (LIB.products) delete LIB.products[d.drop]; });
    });
}

/* ====================================================================

   ==================================================================== */

/* ---- libraryEntryFields   index.html 49857-49937 ---- */
function libraryEntryFields(p, form) {
  const fields = LIB_EDIT_FIELDS;
  /* A FIXED LIST GETS A LIST (BZ): a text box on a closed-set field is how
     the contradictions the scan reports get made. */
  const CHOICES = {
    sub: A.L.TYPES,
    style: A.L.STYLES,
    region: A.L.SCOTCH_REGIONS
  };
  /* A DOT IS A PATH: the field list is flat and a tasting note is not. */
  const valueAt = (obj, k) => {
    const bits = String(k).split('.');
    return bits.length === 1 ? obj[k]
      : ((obj[bits[0]] || {})[bits[1]]);
  };
  const inputs = {};
  fields.forEach(([k, label, type]) => {
    const wrap = el('label', null, label);
    let inp;
    if (CHOICES[k]) {
      inp = document.createElement('select');
      inp.className = 'field';
      /* Blank first: region is empty for anything not Scotch, and clearing one
         has to be possible. */
      const none = document.createElement('option');
      none.value = '';
      none.textContent = '\u2014';
      inp.appendChild(none);
      CHOICES[k].forEach(v => {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = A.L.titleCase ? A.L.titleCase(v) : v;
        inp.appendChild(o);
      });
      const have = p[k] == null ? '' : String(p[k]);
      /* A value the list does not hold is still shown, so opening an entry
         cannot silently change it. */
      if (have && CHOICES[k].indexOf(have) < 0) {
        const o = document.createElement('option');
        o.value = have;
        o.textContent = have + ' (not on the list)';
        inp.appendChild(o);
      }
      inp.value = have;
    } else {
      inp = document.createElement('input');
      inp.className = 'field';
      inp.type = type;
      if (type === 'number') inp.step = '0.1';
      const at = valueAt(p, k);
      inp.value = at == null ? '' : at;
    }
    inputs[k] = inp;
    wrap.appendChild(inp);
    form.appendChild(wrap);
  });
  return { fields: fields, inputs: inputs };
}

/* WHAT A LIBRARY ENTRY IS EDITED THROUGH: a field, its label, and what kind of
   box it gets. A declaration, so it sits beside the function rather than inside
   it - editLibraryEntry is at its size ceiling and the ceiling does not go up
   (rule 30f). */
const LIB_EDIT_FIELDS = [
  ['proof', 'Proof', 'number'], ['dist', 'Distillery', 'text'],
  ['country', 'Country', 'text'], ['sub', 'Category', 'text'],
  ['style', 'Style', 'text'],
  ['age', 'Age', 'number'], ['fin', 'Cask', 'text'],
  ['region', 'Region', 'text'], ['msrp', 'Price', 'number'],
  ['mash', 'Mash bill', 'text'],
  /* THE NOTES, so a sentence pasted into the cask field can be MOVED rather
     than only deleted (BZ, 2026-10-01, third time of asking). A nose and a
     palate are what a described whisky has, so they come first. */
  ['tn.nose', 'Nose', 'text'], ['tn.palate', 'Palate', 'text'],
  ['tn.finish', 'Finish (the taste, not the cask)', 'text']
];

/* SAVING AN ENTRY, which is a rename as well as an edit when the name moves:
   written at the new key and cleared from the old one in the same update, or
   the library holds it twice. Its own function because editLibraryEntry is at
   its size ceiling and the ceiling does not go up (rule 30f). */

/* ---- saveLibraryEntry   index.html 49938-50015 ---- */
function saveLibraryEntry(p, save, inputs, nameInp, after) {
    /* One press: a second tap writes the shared entry twice. */
    if (save.dataset.busy) return;
    save.dataset.busy = '1';
    setTimeout(() => { delete save.dataset.busy; }, 2500);
    const oldKey = p._key || A.L.libKey(p.name);
    const rename = A.L.libraryRename(LIB.products || {}, oldKey,
      nameInp.value, p.name);
    if (!rename.ok) { toast(rename.why); return; }

    const next = Object.assign({}, p, { name: rename.name });
    delete next._key;
    LIB_EDIT_FIELDS.forEach(([k, , type]) => {
      const v = inputs[k].value.trim();
      const bits = String(k).split('.');
      /* A DOT IS A PATH, so the notes write one level down - and a note with
         nothing left in it is removed rather than left as an empty shell. */
      if (bits.length > 1) {
        const holder = Object.assign({}, next[bits[0]]);
        if (v) holder[bits[1]] = v; else delete holder[bits[1]];
        if (Object.keys(holder).length) next[bits[0]] = holder;
        else delete next[bits[0]];
        return;
      }
      if (!v) { delete next[k]; return; }
      // Never NaN into the shared library, where everybody would read it.
      if (type === 'number') {
        const n = A.L.toNum(v);
        if (n === null) { delete next[k]; return; }
        next[k] = n;
      } else { next[k] = v; }
    });
    /* AND THE NEW NAME MUST NOT BE ONE THAT LOST A MERGE. libraryRename refuses
       a TAKEN name, but a consolidated key reads as free and is not;
       renaming into it rebuilds the losing side of a deliberate merge. Same
       guard as the publish and accept paths. */
    /* A RESERVED WORD IS REFUSED HERE, not reported days later by a scan with
       a Fix button beside it (BZ, 2026-10-01: "reserved words in the wrong
       field should be obvious"). The same door the scan asks, so the editor
       and the audit cannot come to disagree about which box a word is in. */

    const rv = A.L.libraryAccepts(rename.key, false, LIB.removed, LIB.graves);
    if (!rv.ok && rv.why !== 'already in the library') {
      toast('That name ' + rv.why); return;
    }
    const now = Date.now();
    // A rename is a MOVE: written at the new key and cleared from the old
    // one in the same update, or the library holds it twice.
    /* THROUGH THE ROW BUILDER, like every other publisher. This wrote `next`
       straight to the entry, so the one place that drops a reserved word was the
       one place the editor went round - and a value somebody never typed went
       back every time they saved something else. The first attempt at this
       refused the save instead, which meant an entry carrying one could not be
       edited at all (BZ, 2026-10-01: "that bottle will not publish to the
       library"). A redundant field is not a reason to refuse a row. */
    const write = { ['catalog/products/' + rename.key]:
                      Object.assign(A.L.libraryEntry(next, refBrands()),
                        { at: now }),
                    stamp: now };
    if (rename.moved) {
      write['catalog/products/' + oldKey] = null;
      /* WHERE IT WENT, so every other device can follow; otherwise they keep the
         old key and bottles pointing at it, reproducing the duplicate. */
      write['renamed/' + oldKey] = { to: rename.key, at: Date.now() };
    }
    ref(NODE.shared)
      .update(A.L.fbEncodePaths(write))
      .then(() => {
        if (rename.moved) delete LIB.products[oldKey];
        LIB.products[rename.key] = next;
        appLog('library: ' + (rename.moved
          ? 'renamed ' + p.name + ' to ' + rename.name
          : 'edited ' + rename.name));
        closeModal(); after();
        toast(rename.moved ? 'Renamed for everyone' : 'Changed for everyone');
      }).catch(e => toast(sayError(e)));
}


/* ---- editLibraryEntry   index.html 50016-50076 ---- */
function editLibraryEntry(p, after) {
  openModal(p.name, m => {
    m.appendChild(el('div', 'sub',
      'Changing this changes it for everyone, on their next open.'));

   joined to it at all (BZ, 2026-09-30). */

/* ---- pickLibraryEntry   index.html 50116-50165 ---- */
function pickLibraryEntry(title, blurb, exceptKey, onPick) {
  openModal(title, m => {
    m.appendChild(el('div', 'sub', blurb));
    const box = el('div', 'form');
    const q = fieldRow('Search the library', 'q', '',
      { placeholder: 'Name of the entry to keep' });
    box.appendChild(q);
    const out = el('div', 'candidates');
    box.appendChild(out);
    m.appendChild(box);

    const input = q.querySelector('input');
    let timer = null;
    const draw = () => {
      const term = (input.value || '').trim();
      out.innerHTML = '';
      if (term.length < ADD_SEARCH_MIN) return;
      const hits = A.L.addCandidates(LIB.products || {}, term, 8)
        .filter(h => !exceptKey
          || (h._key || A.L.libKey(h.name)) !== exceptKey);
      if (!hits.length) {
        out.appendChild(el('div', 'src', 'Nothing else matches that.'));
        return;
      }
      /* WHAT SEPARATES THESE from each other, not what each one is: asked of
         the whole list, because a field every candidate shares tells nobody
         anything (BZ, 2026-10-01: "hard to sort this out given names and
         proofs", on five of six reading "Buffalo Trace - 100 proof"). */
      const apart = A.L.tellApart(hits);
      hits.forEach((hit, i) => {
        const b = el('button', 'candidate');
        b.type = 'button';
        b.appendChild(el('div', 'nm', hit.name));
        if (apart[i]) b.appendChild(el('div', 'sub', apart[i]));
        b.onclick = () => onPick(hit);
        out.appendChild(b);
      });
    };
    input.addEventListener('input', () => {
      if (timer) clearTimeout(timer);
      timer = setTimeout(draw, 180);
    });

    const close = el('button', 'btn ghost wide', 'Cancel');
    close.style.marginTop = '9px';
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

/* SEARCH THE LIBRARY AND PICK ONE. Two callers want this - an entry saying it

/* AN OFFER THAT IS ALREADY IN THE LIBRARY. Nothing to merge - an offer is not
   an entry - so it simply is not wanted, and it drops with the reason naming
   what it already is (BZ, 2026-09-30: "then only use the library bottle"). */

/* ---- confirmPointAt   index.html 50194-50244 ---- */
function confirmPointAt(from, to, after) {
  const dropK = A.L.resolveLibKey(LIB.products, from._key, from.name);
  const keepK = A.L.resolveLibKey(LIB.products, to._key, to.name);
  if (!dropK || !keepK) {
    appLog('point at: could not place ' + (dropK ? to.name : from.name)
      + ' in the library');
    toast('Could not find that entry in the library');
    return;
  }
  if (dropK === keepK) { toast('Those are already one entry'); return; }
  openModal('Point it there?', m => {
    m.appendChild(el('div', 'sub', '\u201c' + from.name + '\u201d becomes a '
      + 'pointer to \u201c' + to.name + '\u201d. Every shelf holding the '
      + 'first follows the second afterwards, and this does not undo.'));
    const go = el('button', 'btn wide btn-gold', 'Point it there');
    go.style.marginTop = '10px';
    go.onclick = () => {
      go.disabled = true;
      libraryMergeWrite([{ drop: dropK, keep: keepK }])
        .then(() => {
          appLog('library: pointed ' + dropK + ' at ' + keepK);
          toast('Now one entry: ' + to.name);
          closeModal();
          if (after) after();
        })
        .catch(e => { go.disabled = false; toast(sayError(e)); });
    };
    m.appendChild(go);
    const no = el('button', 'btn ghost wide', 'Leave them apart');
    no.onclick = closeModal;
    m.appendChild(no);
  });
}

/* ---- libraryImportDialog   index.html 41789-41823 ---- */
function libraryImportDialog() {
  const file = document.createElement('input');
  file.type = 'file';
  file.accept = '.csv,text/csv,text/plain';
  file.onchange = () => {
    const f = file.files && file.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onerror = () => toast('Could not read that file');
    rd.onload = () => {
      let rows;
      try { rows = A.L.parseCSV(rd.result); }
      catch (e) { toast('That is not a CSV'); return; }
      if (!rows || !rows.length) { toast('Nothing in that file'); return; }
      /* THE LIBRARY FIRST, AND NOT AN EMPTY ONE. Every row of this CSV is
         either a change to an entry or a new entry, and against an empty
         library every one of them is NEW - which libraryImportApply would
         then write, duplicating the whole library (BZ, 2026-10-02: "sweep").
         The cache is nulled after every merge, so this is one tap away. */
      withLibrary(() => {
        if (!libraryIsRead()) {
          toast('The library has not loaded — try again in a moment');
          return;
        }
        libraryImportReview(A.L.libraryImportPlan(rows, LIB.products),
          rows.length);
      });
    };
    rd.readAsText(f);
  };
  document.body.appendChild(file);
  file.click();
  setTimeout(() => file.remove(), 0);
}

/* ---- libraryImportApply   index.html 41877-41909 ---- */
function libraryImportApply(plan) {
  const ups = {};
  const all = plan.changes.concat(plan.adds);
  all.forEach(c => {
    const p = (LIB.products || {})[c.key];
    if (p) {
      Object.assign(p, c.set);
    } else {
      LIB.products = LIB.products || {};
      /* The literal LAST: assigned first it is only a suggestion, and the
         key and the name are what this entry is filed under. */
      LIB.products[c.key] = Object.assign({}, c.set,
        { k: c.key, name: c.name });
    }
    Object.keys(c.set).forEach(f => {
      ups['catalog/products/' + c.key + '/' + f] = c.set[f];
    });
    if (!p) ups['catalog/products/' + c.key + '/name'] = c.name;
  });
  ups.stamp = Date.now();
  appLog('library import: ' + plan.changes.length + ' changed, '
    + plan.adds.length + ' added');
  closeModal();
  toast(all.length + ' written to the library');
  ref(NODE.shared)
    .update(A.L.fbEncodePaths(ups))
    .catch(e => {
      appLog('library import: could not publish \u2014 '
        + ((e && e.message) || e));
      toast('Applied here, but not saved for everyone');
    });
}

function libraryFillStart(byKey, after) {
  if (LIB.filling) { libraryFillShow(); return; }
  if (!A.lookupUrl) { toast(A.L.NO_SERVICE_SAY); return; }

  const today = A.L.todayISO();
  /* THE SNAPSHOT, keyed the way the LIBRARY is keyed. */
  const snap = byKey || {};
  const lists = A.L.libraryLists(A.L.libraryRows(snap), A.ledger || {}, today);

  if (!lists.todo.length) {
    openModal('Nothing needs attention', m => {
      m.appendChild(el('div', 'sub', lists.waiting.length
        ? lists.done.length + ' entries are complete. Nothing is due: the rest '
          + 'are on the Still missing list in Clean up, with when each is next tried.'
        : 'Every entry has everything it needs.'));
      const c = el('button', 'btn wide', 'Close');
      c.onclick = closeModal;
      m.appendChild(c);
    });
    return;
  }

  /* How many the day's ceiling will allow, said BEFORE the run rather than
     discovered partway through. */
  const leftToday = Math.max(0, A.L.LOOKUP_CAP
    - A.L.lookupTally(A.tally, today));
  openModal('Look up ' + lists.todo.length + '?', m => {
    if (leftToday < lists.todo.length) {
      const warn = el('div', 'sub');
      warn.className = 'sub warn2';
      warn.textContent = leftToday
        ? 'Only ' + leftToday + ' more lookups today, so '
          + 'this stops after ' + leftToday + ' and the rest wait for tomorrow.'
        : A.L.LOOKUP_LIMIT_SAY;
      m.appendChild(warn);
    }
    m.appendChild(el('div', 'sub',
      lists.done.length + ' done · ' + lists.todo.length + ' need '
      + 'attention · ' + lists.waiting.length + ' resting. The library '
      + 'is ' + lists.score + '% complete.'));
    m.appendChild(el('div', 'sub',
      'Each is looked up once, and only gaps are filled. '
      + 'A miss waits a week, then six '
      + 'months, then a year.'));
    const go = el('button', 'btn wide btn-gold',
      'Look up ' + lists.todo.length);
    go.style.marginTop = '11px';
    go.onclick = () => { closeModal(); libraryFillRun(snap, lists.todo, after); };
    m.appendChild(go);
    const c = el('button', 'btn ghost wide', 'Not now');
    c.onclick = closeModal;
    m.appendChild(c);
  });
}

/* The run. One bottle at a time, against the snapshot, writing as it goes. */

/* ---- libraryFillRun   index.html 49271-49352 ---- */
function libraryFillRun(snap, todo, after) {
  LIB.filling = true;
  LIB.fill = { total: todo.length, done: 0, wrote: 0, parked: 0, errors: 0,
               note: 'Starting\u2026' };
  libraryFillShow();

  const today = A.L.todayISO();
  const step = i => {
    const f = LIB.fill;
    if (!f) return;
    if (!LIB.filling || i >= todo.length) return libraryFillDone(after);

    const x = todo[i];
    f.done = i + 1;
    f.note = 'Looking up ' + (i + 1) + ' of ' + todo.length + ': ' + x.name;
    libraryFillTick();

    /* The day's ceiling stops the RUN rather than failing a bottle. */
    if (!A.L.lookupAllowed(A.tally, today)) {
      f.note = 'Stopped at the daily limit of ' + A.L.LOOKUP_CAP + '.';
      appLog('library fill: stopped at the daily lookup limit with '
        + (todo.length - i) + ' still to do');
      LIB.filling = false;
      return libraryFillDone(after);
    }
    /* x.missing is what libraryLists decided this entry needs. Sending it
       points the service's searches at the one open field - after a first
       fill, usually just the mash bill. */
    adminService(x.name, A.L.INTAKE_LOOKUP_MS, x.missing).then(raw => {
      const got = A.L.parseLookup(raw, { name: x.name });
      const closes = A.L.gapsClosed(got, x.missing);
      appLog('  fill ' + x.name.slice(0, 34)
        + ' | short of ' + x.missing.join(',')
        + ' | ' + (closes.length ? 'WRITE ' + closes.join(',') : 'WAITLIST'));

      if (!closes.length) {
        f.parked++;
        A.ledger = A.L.recordLookup(A.ledger, x.k, 'empty', today);
        return next(i);
      }
      /* Written against the SNAPSHOT the gap was decided from. A live cache here
         is how the run and the writer came to disagree. */
      const built = A.L.libraryFillWrite(
        [{ k: x.k, name: x.name, got: got, missing: x.missing }],
        { [x.k]: true }, snap, Date.now());
      if (!built.names.length) {
        // Nothing to put in, per the snapshot: a miss, from the run's view.
        f.parked++;
        A.ledger = A.L.recordLookup(A.ledger, x.k, 'empty', today);
        return next(i);
      }
      libRef().update(A.L.fbEncodePaths(built.updates)).then(() => {
        f.wrote++;
        A.ledger = A.L.recordLookup(A.ledger, x.k, 'found', today);
        // Keep the snapshot honest, so a later bottle sees what was written.
        Object.keys(built.updates).forEach(path => {
          const bits = path.split('/');
          if (bits[1] && snap[bits[0]]) snap[bits[0]][bits[1]] = built.updates[path];
        });
        next(i);
      }).catch(e => {
        f.errors++;
        appLog('  fill write failed: ' + ((e && e.message) || e));
        next(i);
      });
    }).catch(e => {
      f.errors++;
      appLog('  fill ' + x.name.slice(0, 34) + ' \u2014 '
        + ((e && e.message) || e));
      next(i);
    });
  };

  const next = i => {
    libraryFillTick();
    if (!LIB.filling) return libraryFillDone(after);
    step(i + 1);
  };

  step(0);
}

/* ---- libraryFillDone   index.html 49363-49392 ---- */
function libraryFillDone(after) {
  const f = LIB.fill;
  if (!f) return;
  LIB.filling = false;
  LIB.fill = null;
  /* The ledger is saved ONCE, here: save_ pushes to the account, so saving
     per bottle is hundreds of round trips over a run. Nothing needs it
     mid-run; the snapshot carries what has been written. */
  adminSave();
  /* ITS OWN WINDOW only: a run finishing in the background must not close a
     bottle half edited or a purchase being entered. */
  if (document.getElementById('fillNote')) closeModal();
  appLog('library fill: asked ' + f.done + ', wrote ' + f.wrote
    + ', waitlisted ' + f.parked
    + (f.errors ? ', ' + f.errors + ' failed' : ''));
  /* A run stopped by the ceiling reads like a run that did nothing, so it
     says which it was. */
  toast(A.L.fillSay(Object.assign(libraryFillTally(f), { finished: true,
    stopped: f.note && /daily limit/.test(f.note) ? 'limit' : null })));
  LIB.products = null;
  /* AND REDRAW THE SCREEN THE RUN WAS STARTED FROM. */
  const back = () => {
    /* MOVED: this page's library section, not the app's screen. */
    const on = $('#sec-library');
    if (on && on.classList.contains('on')) renderLibraryScreen();
  };
  if (after) after();
  setTimeout(back, 60);
}

/* ONE WAY TO HAND SOMEBODY A FILE. Every export goes through here (2026-09-29,
   iOS users: no download option). Six buttons built their own anchor, and no
   check in this project could see what they did on an iPhone, because every
   harness here drives Chromium.

   A HOME-SCREEN iOS APP PRESENTS NO FILE DOWNLOAD. There is nowhere for the
   file to go, no Downloads to open afterwards, and nothing said either way -
   which is exactly "there is no download option". The share sheet is the route
   iOS gives, and Save to Files IS the download there. A.L.saveRoute holds the
   rule so the decision is testable, and ios.js proves the file is handed over.

   The anchor is attached before it is clicked. That is belt and braces rather
   than the diagnosis, and worth being honest about: a detached anchor is a
   pattern that has broken on older Safari, but it downloads perfectly well in
   the WebKit this project can test (26.6), so it does not by itself explain
   anything.

   Closing the sheet is not a failure and says nothing. A sheet that will not
   open falls back to the anchor, which now works. The object URL is revoked
   late: two seconds is not always enough for a phone to have taken the file,
   and revoking early is a download that stops halfway. */

/* ---- askAllRow   index.html 51147-51174 ---- */
function askAllRow(all, rows, after) {

    openModal('Look up all ' + rows.length + '?', m => {

   doing the shelf half - two functions, two jobs, neither a copy of the
   other. */
function applyLibraryFix(key, fix, where) {
  const lib = (LIB.products || {})[key];
  /* GONE IS GONE. index.html could still fix a shelf row whose library
     entry had been merged away; with no shelf, no entry means nothing to
     do, and saying so is what makes the caller rescan. */
  if (!lib) return false;
  Object.assign(lib, fix.set);
  appLog(where + ': ' + key + ' \u2014 ' + fix.said);
  /* Written for everybody, or the next device to scan reports it again. */
  if (A.user) {
    libraryFieldWrite({ [key]: fix.set })
      .catch(e2 => appLog(where + ': could not publish ' + key + ' \u2014 '
        + ((e2 && e2.message) || e2)));

  return true;
}

           would publish, the notes written for a flight card, and what this
           device holds that belongs to everybody all read a shelf, and this
           page has none. They are Tidy your shelf in the app, drawn for
           every user rather than for one admin (BZ). */
        libraryRemovedList(m);
        /* THE ONES THAT NEED NO DECISION: identical name, house and proof,
           so one survives and it does not matter which (BZ). These are the
           rows with no per-row Merge, because identical names derive
           identical keys and the guard refuses to merge a key with itself. */
        identicalPairsButton(found, m, draw);
        m.appendChild(copyWholeScanButton(found, count));
        if (!found.length) {
          m.appendChild(el('div', 'empty',
            'Nothing contradicts itself. That is worth knowing rather than '
            + 'assuming.'));
          return;
        }
        found.forEach(f => {
          const card = el('div', 'sheet');
          card.appendChild(el('h3', null, f.title));
          if (f.why) card.appendChild(el('div', 'sub', f.why));
          /* IN BULK, because a finding with nine rows in it is one
             decision nine times over when they are all the same call. */
          const bulk = el('div', 'rowacts');
          bulk.style.marginBottom = '6px';
          bulkControls(f, bulk, draw, rescanTheLibrary);
          if (f.items.length > 1) card.appendChild(bulk);

          /* ALL OF THEM, NOT TWELVE: the heading counts every item and the group
             buttons act on every item, so every item must be shown. */
          f.items.forEach(it => {
            /* THREE COLUMNS FOR A DUPLICATE: this bottle, that bottle, what to do (BZ).
               On one line with == between, the names ran under the buttons. */
            // The finding says so, rather than the screen knowing one id.
            const isPair = !!f.pairs && / {2}== {2}/.test(it.text || '');
            const row = el('div', isPair ? 'dupgrid' : 'item scanrow');
            if (!isPair) {
              /* STACKED, NOT COLUMNED (BZ): the issue, then what it would become, then
                 the buttons, each full width. A long whisky name and two
                 buttons never fit one line; a single column has nothing to
                 overflow and cannot be broken by a cascade. */
              row.style.display = 'block';
              row.style.padding = '10px 12px';
            }
            if (isPair) {
              const sides = String(it.text).split('  ==  ');
              sides.forEach((sideText, si) => {
                const col = el('div', 'dupside');
                const nm = el('button', 'nm');
                nm.style.cssText = 'background:none;border:0;padding:0;'
                  + 'text-align:left;font:inherit;color:inherit;'
                  + 'cursor:pointer;white-space:normal';
                const bits = String(sideText).split(' · ');
                nm.textContent = bits[0];
                const k2 = (it.keys || [])[si] || A.L.libKey(bits[0].trim());
                nm.onclick = () => {
                  const e2 = (LIB.products || {})[k2];
                  if (!e2) { toast('That entry has gone already'); return; }
                  editLibraryEntry(Object.assign({ _key: k2 }, e2),
                    () => { LIB.products = null; draw(); });
                };
                col.appendChild(nm);
                if (bits[1]) col.appendChild(el('div', 'sub', bits[1]));
                /* WHAT ACTUALLY DIFFERS. When both sides print the same name, house and
                   proof, the only difference is the key each is filed under -
                   which is also what Merge acts on, and why a row whose two
                   keys match cannot be merged. Shown for every pair. */
                const kShown = (it.keys || [])[si]
                  || A.L.resolveLibKey(LIB.products, null, bits[0]);
                const kEl = el('div', 'src', kShown
                  ? 'filed as ' + kShown : 'not found in the library');
                kEl.style.cssText = 'font-family:ui-monospace,monospace;'
                  + 'font-size:12px;opacity:.6;word-break:break-all';
                col.appendChild(kEl);
                row.appendChild(col);
              });
            }
            /* IT WRAPS. `oneline` clips (nowrap, overflow hidden); a shelf row can be
               clipped because you can open it, but a finding is a sentence
               and has to be read whole. */
            const go = el('button', 'nm');
            go.style.cssText = 'white-space:normal;overflow-wrap:anywhere;'
              + 'text-align:left;display:block;width:100%';
            go.style.cssText = 'background:none;border:0;padding:0;'
              + 'text-align:left;font:inherit;color:inherit;cursor:pointer';
            go.textContent = it.text;
            go.onclick = () => {
              const entry = (LIB.products || {})[it.key];
              if (!entry) { toast('That entry has gone already'); return; }
              /* BACK TO THE SCAN, not to the library: the list still to judge is
                 what somebody wants when the editor closes.
                 DO NOT THROW THE CACHE AWAY: editLibraryEntry has already
                 written the saved entry into LIB.products, and nulling it
                 made draw() audit an empty library, so one fix looked like
                 it had cleared every finding. */
              editLibraryEntry(Object.assign({ _key: it.key }, entry),
                () => draw());
            };
            const rowL = el('div');
            /* The text column must be allowed to be narrower than its longest word, or
               it grows and runs under the buttons whatever the grid says. */
            rowL.style.minWidth = '0';
            rowL.style.overflowWrap = 'anywhere';
            if (!isPair) rowL.appendChild(go);
            /* AND WHAT TO DO ABOUT IT, under the name (BZ). */
            const tip = A.L.auditSuggestion(f.id,
              (LIB.products || {})[it.key] || {}, it.text);
            if (tip && !isPair) rowL.appendChild(el('div', 'src', tip));
            if (!isPair) row.appendChild(rowL);
            /* THREE ANSWERS: the row itself is the fix (it opens the entry); these
               two are keep it for now and dismiss (BZ). A verdict is written
               where every admin reads it, because it is a judgment about a
               shared row rather than this device's opinion of it. */
            const acts = el('div', 'rowacts');
            acts.appendChild(mendRowButton(f, it, rescanTheLibrary));
            /* On their own line, under the words they act on. */
            if (!isPair) {
              acts.style.marginTop = '8px';
              acts.style.justifyContent = 'flex-start';
            }
            /* THE PRESS TAKES EFFECT AT ONCE. Waiting for the shared admin write to
               succeed left the row sitting there when it was refused or slow,
               with nothing to say why. */
            const verdict = (v, said) => {
              const id = f.id + ':' + it.key;
              const before = LIB.reviewed || {};
              LIB.reviewed = Object.assign({}, before,
                { [id]: { v: v, at: Date.now() } });
              appLog('library scan: ' + id + ' \u2014 ' + said);
              draw();
              ref(NODE.reviewed)
                .child(A.L.fbKey(id))
                .set({ v: v, at: Date.now(),
                       by: (A.user || {}).uid || '' })
                .catch(e => {
                  LIB.reviewed = before;
                  appLog('library scan: ' + id + ' would not save \u2014 '
                    + ((e && e.message) || e));
                  toast('Could not save: '
                    + sayError(e));
                  draw();
                });
            };
            /* LOOK IT UP: the service that returns mash bills for the fill run is
               asked here, rather than saying a bill is wrong and leaving
               somebody to find the right one (BZ). */
            if (f.id === 'mashsum') {
              const look = el('button', 'chip', 'Look it up');
              look.onclick = async () => {
                const entry = (LIB.products || {})[it.key];
                if (!entry) { toast('That entry has gone already'); return; }
                buttonWorking(look, 'Looking\u2026');
                try {
                  /* AN ARRAY. A.L.lookupUrl does (need || []).filter, so a bare string threw
                     "(need || []).filter is not a function" the first time BZ pressed it. */
                  const raw = await adminService(entry.name, 20000, ['mash']);
                  const res = A.L.parseLookup(raw, { needIdentity: false });
                  const bill = (res && (res.mash || res.mashbill)) || null;
                  if (!bill) {
                    toast('Nothing came back about the mash bill');
                    look.disabled = false;
                    look.textContent = 'Look it up';
                    return;
                  }
                  appLog('mash lookup for ' + entry.name + ': ' + bill);
                  /* Straight into the editor with the bill filled in,
                      and back to the scan when it closes. */
                  editLibraryEntry(
                    Object.assign({ _key: it.key }, entry, { mash: bill }),
                    () => { LIB.products = null; draw(); });
                } catch (e2) {
                  look.disabled = false;
                  look.textContent = 'Look it up';
                  toast(sayError(e2));
                }
              };
              acts.appendChild(look);
            }
            /* MERGE ON EVERY PAIR (BZ). Two rows for one whisky are two half-filled
               entries and an overstated count; the fix is always keep one and
               point the other at it, through the rename record every device
               already follows (A.L.applyLibraryMoves). Keys are used when the
               check supplied them and derived from the names when not, so the
               button appears wherever a merge is possible at all. */
            if (isPair) {
              /* THE KEYS THE CHECK FOUND, not names read back off the screen: two
                 entries differing by a stray space print identically. */
              const sides = String(it.text).split('  ==  ')
                .map(x => x.split(' · ')[0].trim());
              /* RESOLVED, not derived. Two rows printed identically derive the same key,
                 and the guard below refuses to merge a key with itself;
                 asking the library which entries they are gives two keys. */
              let kk = [
                (it.keys || [])[0]
                  || A.L.resolveLibKey(LIB.products, null, sides[0]),
                (it.keys || [])[1]
                  || A.L.resolveLibKey(LIB.products, null, sides[1])
              ];
              /* Two rows printed identically resolve to the same entry,
                 because a lookup by name can only find one of them. Ask
                 for every entry under that name instead. */
              if (kk[0] && kk[0] === kk[1]) {
                const both = A.L.libKeysNamed(LIB.products, sides[0]);
                if (both.length >= 2) kk = [both[0], both[1]];
              }
              acts.appendChild(mergePairButton(sides, kk, draw));
            }
            /* UPDATE, AND IT SAYS WHAT IT WILL CHANGE. */
            /* THE LIBRARY'S OWN ENTRY first: these rows are library entries,
               and prod() looks only in the shelf catalog, so the fix came back
               null and the tick silently never appeared. */
            const entry = (LIB.products || {})[it.key]
              || {};
            /* The item carries what the finding worked out - the spelling to keep, the
               key to merge into - so it is handed to the fix rather than re-derived. */
            const fix = A.L.auditFix(f.id, entry, it.text, it);
            if (fix) {
              /* ICON BUTTONS (BZ): a tick by the new value and a cross by the current
                 one. The words move to the advice line above; the button
                 carries them in its title and aria-label for hover and
                 screen readers. */
              const up = el('button', 'chip btn-gold');
              up.textContent = (fix.pick || '\u2713') + ' \u2713';
              up.title = fix.label;
              up.setAttribute('aria-label', fix.label);
              /* Writes to the library entry, and to the shelf too when the same key is
                 on it, so the correction shows in both places. */
              up.onclick = () => {
                if (!applyLibraryFix(it.key, fix, 'library scan')) {
                  toast('That entry is no longer in the library');
                  verdict('ok', 'gone before it could be fixed');
                  return;
                }
                toast(fix.done);
                verdict('fixed', fix.said);
              };
              acts.appendChild(up);
            }
            /* And the current value, with the cross: keeping it is an ANSWER, not a
               refusal to answer, so it is worded as one and remembered like one. */
            const keepWord = fix && fix.keep ? fix.keep + ' \u2715'
              : '\u2715';
            const later = el('button', 'chip quiet'
              + (fix && fix.keep ? '' : ' iconchip'));
            later.textContent = keepWord;
            later.title = 'Leave it as it is, and stop asking';
            later.setAttribute('aria-label',
              'Leave it as it is, and stop asking');
            later.onclick = () => verdict('ok', 'left as it stands');
            acts.appendChild(later);
            /* Ignore already says this; two buttons that both mean "do nothing"
               confuse. */
            row.appendChild(acts);
            card.appendChild(row);
          });
          /* No "and N more": the heading's count and the rows are the same number. */
          /* A house split across two spellings is merged in place, here: the
             scan opens FROM the library screen, so navigating there only
             closed it (BZ). `dups` still travels, because which of two entries
             survives is chosen on the library screen. */
          if (f.id === 'houses') {
            const vars2 = A.L.houseVariants(Object.values(LIB.products || {}));
            const plan2 = vars2.length
              /* The keyed MAP, not its values: Object.values drops the keys
                 and every row came back keyed "0", "1", "2". */
              ? A.L.houseMergePlan(A.L.libraryRows(LIB.products || {}), vars2[0])
              : null;
            if (plan2 && plan2.rows.length) {
              const go2 = houseMergeButton(plan2, () => draw());
              go2.style.marginTop = '9px';
              card.appendChild(go2);
            }
          }
          m.appendChild(card);
        });
      });
    };
    /* Fetch first if this device has not read the library yet, then draw.
       One round trip, and only when it is actually needed. */
    if (LIB.products) { draw(); return; }
    working('Reading the library\u2026');
    libRef().once('value').then(sn => {
      const v = sn.val();
      LIB.products = A.L.libraryFromValue(v);
      working();
      draw();
    }).catch(e => {
      working();
      toast(sayError(e, 'Could not read the library'));
    });
}


boot();
</script>
</body>
</html>
