<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bottlefolio admin</title>
<!--
  THE ADMIN HALF, OUT OF THE APP (BZ, 2026-10-27: "we need to separate out
  admin functions and solve for that").

  WHY THIS FILE EXISTS. index.html shipped the admin doors to everybody who
  installed it. The Firebase rules were never the problem - they enforce the
  boundary properly and `admins/<uid>` is write:false, so no account can
  promote itself - but every non-admin downloaded the admin screens and could
  reach them by flipping a local switch, and got a refusal. A door nobody can
  open is worse than no door. That matters more now the app is going to the
  stores, where the people installing it are strangers.

  NOT A SECOND COPY OF ANYTHING. Everything that is a decision comes out of
  index.html at boot: the L. engine, the Firebase config, APP_VERSION and the
  SDK urls. This file holds admin SCREENS and nothing else. The engine is
  sliced between the same two anchors engine.js uses, which is why that slice
  is load-bearing in two places now and why admin.js asserts it.

  DESKTOP ONLY, ON PURPOSE (BZ, 2026-10-27). No manifest, no icons, no service
  worker, no phone layout. It is a page you open on the PC to work the queue,
  so it carries its own small shell rather than the app's phone-first one -
  el() and $() are DOM sugar, not decisions, and nothing here restates a rule
  that lives in the engine.

  IT IS PUBLIC AND THAT IS FINE. Anyone may load it; without a uid under
  bz-apps/whisky/admins every read it makes is refused, and nothing in
  index.html's Firebase config was ever a secret.
-->
<style>
  /* Tokens light, redefined for dark. A desktop tool: denser than the app,
     and deliberately not the app's visual system. */
  :root{
    --paper:#fbfaf7; --ink:#1b1a18; --sub:#6a665e; --line:#e2ded5;
    --card:#ffffff; --rust:#a4472b; --good:#3f6b4a; --quiet:#f1eee8;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#17161a; --ink:#ece9e3; --sub:#9b958a; --line:#2e2c31;
      --card:#1f1e23; --rust:#d8755a; --good:#7faa89; --quiet:#26242a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .top{display:flex;align-items:center;gap:10px;padding:10px 16px;
    border-bottom:1px solid var(--line);position:sticky;top:0;
    background:var(--paper);z-index:5}
  .brand{font-weight:600;letter-spacing:.01em}
  .tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--rust);border:1px solid var(--rust);border-radius:3px;
    padding:1px 5px;margin-left:6px;vertical-align:2px}
  .top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  main{max-width:900px;margin:0 auto;padding:16px}
  h1{font-size:19px;margin:0 0 2px}
  h3{font-size:15px;margin:0 0 6px}
  .rs{font-size:11px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--sub);margin:18px 0 6px}
  .sheet{background:var(--card);border:1px solid var(--line);
    border-radius:6px;padding:12px 14px;margin-bottom:10px}
  .sub{color:var(--sub);font-size:13px}
  .src{color:var(--sub);font-size:12px}
  .nm{font-weight:600}
  .item{display:flex;align-items:flex-start;gap:12px;
    justify-content:space-between;padding:10px 0;
    border-top:1px solid var(--line)}
  .item:first-of-type{border-top:0}
  .rowacts{display:flex;gap:6px;flex:none}
  .btn{font:inherit;padding:7px 12px;border-radius:5px;cursor:pointer;
    border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.wide{display:block;width:100%}
  .btn-sm{padding:4px 9px;font-size:13px}
  .chip{font:inherit;font-size:12px;padding:3px 9px;border-radius:11px;
    border:1px solid var(--line);background:var(--quiet);color:var(--ink);
    cursor:pointer}
  .chip.quiet{color:var(--sub)}
  .btn[disabled],.chip[disabled]{opacity:.5;cursor:default}
  .field{font:inherit;padding:7px 9px;border:1px solid var(--line);
    border-radius:5px;background:var(--paper);color:var(--ink);width:100%}
  .pourtag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;
    border:1px solid var(--line);border-radius:3px;padding:0 4px;
    margin-left:6px;color:var(--sub);vertical-align:1px;font-weight:400}
  .pourtag.blend{color:var(--good);border-color:var(--good)}
  .pourtag.wish{color:var(--rust);border-color:var(--rust)}
  .lookrow{display:flex;gap:8px;align-items:center}
  #modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.45);
    display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow:auto;z-index:20}
  #modalBox{background:var(--card);border:1px solid var(--line);
    border-radius:8px;padding:16px;width:100%;max-width:460px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;
    background:var(--ink);color:var(--paper);padding:9px 14px;
    border-radius:5px;z-index:30;max-width:90vw}
  [hidden]{display:none!important}
  .mono{font-family:var(--mono);font-size:12px;word-break:break-all;
    user-select:all;cursor:text}
  .bad{color:var(--rust)}

  /* THE FOUR SURFACES. A nav rather than four pages: this is one tool on a
     desktop, and a tab that keeps its drawn section is how a judgement made
     on one surface is still visible when you come back from another. */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);
    margin-bottom:14px}
  .tab{font:inherit;padding:8px 13px;border:0;background:transparent;
    color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;
    margin-bottom:-1px}
  .tab.on{color:var(--ink);border-bottom-color:var(--rust);font-weight:600}
  .tab .count{display:inline-block;margin-left:5px;font-size:11px;
    background:var(--rust);color:var(--paper);border-radius:9px;
    padding:0 6px;vertical-align:1px}
  .tab .count:empty{display:none}
  .sec{display:none}
  .sec.on{display:block}

  /* THE CLASSES THE MOVED CODE ALREADY NAMES. index.html's own styling is
     phone-first and is not copied; these are the same names given this
     page's denser desktop shape, so the moved markup needs no rewriting.
     A class the moved code asks for and this file does not define is an
     invisible fault - admin.js lists them and fails on a missing one. */
  .btn-gold{border-color:var(--rust);background:var(--rust);
    color:var(--paper)}
  .btn.ghost.wide{text-align:center}
  .actionrow{display:flex;gap:6px;flex-wrap:wrap}
  .form{display:grid;gap:9px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--sub);margin-bottom:3px}
  .oneline{display:flex;gap:8px;align-items:center}
  .empty{color:var(--sub);padding:14px 0;text-align:center}
  .warn2{color:var(--rust);font-size:13px;margin-top:4px}
  .looknote{background:var(--quiet);border:1px solid var(--line);
    border-radius:5px;padding:9px 11px;margin-bottom:10px;font-size:13px}
  .scrollbox{border:1px solid var(--line);border-radius:5px;padding:0 10px}
  .pickbox{display:grid;gap:2px}
  .candidates{display:grid;gap:6px;margin-top:8px}
  .candidate{border:1px solid var(--line);border-radius:5px;padding:8px 10px}
  /* A DUPLICATE READS AS THREE COLUMNS (BZ): this bottle, that bottle, what
     to do. On a desktop they fit, which is the whole reason this page is
     desktop only. */
  .dupgrid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;
    align-items:start;padding:10px 0;border-top:1px solid var(--line)}
  .dupside{min-width:0}
  .scanrow{display:block}
  .item.scanrow{display:block}
  .item.pair{display:flex}
  .pf{color:var(--sub);font-size:12px;flex:none}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:8px}
  .tile{font:inherit;text-align:left;padding:10px 12px;cursor:pointer;
    border:1px solid var(--line);border-radius:5px;background:var(--card);
    color:var(--ink)}
  .tile .v{font-size:18px;font-weight:600}
  .tile .l{font-size:12px;color:var(--sub)}
  details{border:1px solid var(--line);border-radius:5px;padding:8px 10px}
  summary{cursor:pointer}
</style>
</head>
<body>

<header class="top">
  <div class="brand">Bottlefolio<span class="tag">admin</span></div>
  <div class="right">
    <span id="who" class="src"></span>
    <button id="out" class="chip" hidden>Sign out</button>
  </div>
</header>

<main>
  <div id="gate" class="sheet"><div class="sub">Starting&hellip;</div></div>
  <div id="body" hidden>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-go="people">People</button>
      <button class="tab" data-go="library">Library</button>
      <button class="tab" data-go="offers">Offered<span id="offerN" class="count"></span></button>
      <button class="tab" data-go="scan">Clean up</button>
    </nav>
    <section id="sec-people" class="sec on"></section>
    <section id="sec-library" class="sec"></section>
    <section id="sec-offers" class="sec"></section>
    <section id="sec-scan" class="sec"></section>
  </div>
</main>

<div id="modalWrap" hidden><div id="modalBox"></div></div>
<div id="toast" hidden></div>

<script>
/* ===================================================================
   THE SHELL. Small on purpose: see the comment at the top of the file.
   =================================================================== */
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x !== undefined && x !== null) n.textContent = x;
  return n; };

/* The admin tool's state. A deliberately different name from the app's FB,
   because this is not the app and a reader should not expect app behaviour. */
const A = { L: null, user: null, version: '', config: null, admin: false,
  /* The lookup address, this device's day tally and fill ledger, and the
     intake's daily allowance. adminLoad fills the last four from storage. */
  lookupUrl: '', tally: {}, ledger: {}, budget: 100, intakeTally: {} };
/* ON THE WINDOW ON PURPOSE. A top-level const in a plain script is not a
   window property, so admin.js could not read a thing about the boot and
   its first run passed four checks against `undefined`. It is also what
   BZ would open the console to look at. */
window.A = A;

/* WHAT THE APP WOULD HAVE LOGGED goes to the console here. BZ reads the app's
   log in the app; this page is driven while watching it. */
function appLog(m) { console.log('[admin] ' + m); }

let TOAST_T = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(TOAST_T);
  TOAST_T = setTimeout(() => { t.hidden = true; }, 3200);
}

function openModal(title, fill) {
  const box = $('#modalBox');
  box.innerHTML = '';
  if (title) box.appendChild(el('h3', null, title));
  fill(box);
  $('#modalWrap').hidden = false;
}
function closeModal() { $('#modalWrap').hidden = true; $('#modalBox').innerHTML = ''; }
$('#modalWrap').onclick = e => { if (e.target.id === 'modalWrap') closeModal(); };

/* THE DATABASE'S OWN WORDS, through the engine. L.plainError holds the rule;
   this only logs the raw text beside it, exactly as index.html does. */
function sayError(e, fallback) {
  const raw = (e && (e.message || e.code)) || String(e);
  appLog('failure shown in plain words: ' + String(raw).slice(0, 200));
  return A.L.plainError(e, fallback);
}

function buttonWorking(btn, label) {
  btn.disabled = true;
  if (label) btn.textContent = label;
}

/* ===================================================================
   THE NODES.

   THE ONE THING THIS FILE SAYS TWICE. index.html names these paths too -
   67 sites name a bz-apps/whisky path across 25 distinct paths, and no
   shared table exists to read them from. They are gathered here rather than
   scattered through the functions below so the duplication is one block a
   reader can see, not eight call sites. The fix is ONE shared path table in
   the engine that both files read - not named here, because naming a door
   that does not exist yet sends the next reader hunting for it; it is its own
   job, because half-migrating
   67 call sites would leave two doors, which is worse than one flagged copy.
   =================================================================== */
const NODE = {
  root:       'bz-apps/whisky',
  admins:     'bz-apps/whisky/admins',
  stats:      'bz-apps/whisky/stats',
  directory:  'bz-apps/whisky/directory',
  diagnostics:'bz-apps/whisky/diagnostics',
  shares:     'bz-apps/whisky/shares',
  sharedWith: 'bz-apps/whisky/sharedWith',
  requests:   'bz-apps/whisky/requests'
};
const ref = p => firebase.database().ref(p);

/* ===================================================================
   BOOT. Everything that is a decision is read out of index.html.
   =================================================================== */

/* The same two anchors engine.js uses. If either moves, this page stops
   booting and admin.js says so - which is the point of asserting it there. */
const ENGINE_START = 'const L = {};';
const ENGINE_END = '/* =====================================================================\n   STATE + RENDER';

function sliceEngine(html) {
  const a = html.indexOf(ENGINE_START);
  const b = html.indexOf(ENGINE_END);
  if (a < 0 || b < 0) throw new Error('the engine anchors are not in index.html');
  return new Function(html.slice(a, b) + '\nreturn L;')();
}

/* THE CONFIG, OUT OF THE APP, so there is one copy of the project it talks
   to. It sits inside `const FB = {...}` so it cannot be sliced on a line
   boundary; the braces are balanced instead. Values are plain strings, so
   nothing inside them can carry a brace. */
function sliceConfig(html) {
  const at = html.indexOf('config: {');
  if (at < 0) throw new Error('the Firebase config is not in index.html');
  const open = html.indexOf('{', at);
  let depth = 0, end = -1;
  for (let i = open; i < html.length; i++) {
    if (html[i] === '{') depth++;
    else if (html[i] === '}') { depth--; if (!depth) { end = i; break; } }
  }
  if (end < 0) throw new Error('the Firebase config block does not close');
  return new Function('return ' + html.slice(open, end + 1))();
}

function sliceVersion(html) {
  const m = html.match(/const APP_VERSION = '([^']+)'/);
  return m ? m[1] : '';
}

/* THE LOOKUP ADDRESS, out of the app for the same reason as everything else
   here: index.html's comment on DEFAULT_LOOKUP_URL says never to change it,
   and a second spelling of it on this page is how it comes to be changed in
   one place only. The app lets a person override it in Settings; this page
   has no settings and uses the shipped address. */
function sliceLookupUrl(html) {
  const m = html.match(/const DEFAULT_LOOKUP_URL = '([^']+)'/);
  return m ? m[1] : '';
}

/* AND THE SDK URLS, so the version is chosen in one place. index.html loads
   these three itself; reading them from there means an SDK bump moves both. */
function sliceSdk(html) {
  const out = [];
  const re = /https:\/\/www\.gstatic\.com\/firebasejs\/[0-9.]+\/firebase-[a-z-]+\.js/g;
  let m;
  while ((m = re.exec(html))) if (out.indexOf(m[0]) < 0) out.push(m[0]);
  if (!out.length) throw new Error('no Firebase SDK urls in index.html');
  return out;
}

const loadScript = src => new Promise((res, rej) => {
  const s = document.createElement('script');
  s.src = src; s.onload = res; s.onerror = () => rej(new Error('could not load ' + src));
  document.head.appendChild(s);
});

function said(msg, sub) {
  const g = $('#gate');
  g.innerHTML = '';
  g.appendChild(el('h3', null, msg));
  if (sub) g.appendChild(el('div', 'sub', sub));
  g.hidden = false;
  return g;
}

async function boot() {
  said('Reading the app…', 'The engine, the config and the build all come out of index.html.');
  let html;
  try {
    const r = await fetch('index.html', { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    html = await r.text();
  } catch (e) {
    said('Could not read index.html', 'This page is only useful beside the app: '
      + ((e && e.message) || e));
    return;
  }
  try {
    A.L = sliceEngine(html);
    A.config = sliceConfig(html);
    A.version = sliceVersion(html);
    A.lookupUrl = sliceLookupUrl(html);
    var sdk = sliceSdk(html);
  } catch (e) {
    said('The app is not the shape this page expects', (e && e.message) || String(e));
    return;
  }
  adminLoad();
  appLog('engine loaded: ' + Object.keys(A.L).length + ' entries, app v'
    + A.version + ', lookup ' + (A.lookupUrl ? 'address read' : 'NOT read'));
  $('#who').textContent = 'app v' + A.version;

  try {
    for (const u of sdk) await loadScript(u);
    firebase.initializeApp(A.config);
  } catch (e) {
    said('Firebase would not start', (e && e.message) || String(e));
    return;
  }

  firebase.auth().onAuthStateChanged(u => { A.user = u || null; gate(); });
}

/* THE GATE. Signed out, signed in and not an admin, signed in and an admin:
   three states, each said plainly. The database decides - this only reads
   the answer and says it. */
function gate() {
  const g = $('#gate');
  $('#body').hidden = true;
  $('#out').hidden = !A.user;
  if (!A.user) {
    g.innerHTML = '';
    g.appendChild(el('h3', null, 'Sign in'));
    g.appendChild(el('div', 'sub',
      'This page administers the shared library and the people with accounts. '
      + 'It only works for an account listed under admins.'));
    const b = el('button', 'btn', 'Sign in with Google');
    b.style.marginTop = '10px';
    b.onclick = () => {
      b.disabled = true;
      firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
        .catch(e => { b.disabled = false; toast(sayError(e, 'Sign-in failed')); });
    };
    g.appendChild(b);
    g.hidden = false;
    $('#who').textContent = 'app v' + A.version;
    return;
  }
  $('#who').textContent = (A.user.email || A.user.uid) + ' · app v' + A.version;
  said('Checking…');
  /* admins/<uid> and nothing else. A refused read is NOT an answer of false:
     said as refused, because telling somebody they are not an admin when the
     database would not say is a guess. */
  ref(NODE.admins).child(A.user.uid).once('value').then(s => {
    A.admin = s.val() === true;
    if (!A.admin) {
      said('Not an admin',
        'This account is signed in but is not listed under ' + NODE.admins
        + '. That node is write:false on purpose, so it is added in the '
        + 'Firebase console.');
      return;
    }
    $('#gate').hidden = true;
    $('#body').hidden = false;
    /* THE TABS, WIRED ONCE. Each draws the first time it is opened and keeps
       what it drew, so a verdict given on the scan is still there after a
       trip to the offers queue. */
    Array.prototype.forEach.call(document.querySelectorAll('#tabs .tab'),
      t => { t.onclick = () => showSection(t.getAttribute('data-go')); });
    showSection('people');
    /* AND THE COUNT ON THE OFFERED TAB, without drawing that surface: the
       number is why you would open it. */
    countOffers();
    /* THE VETTING STARTS HERE (BZ, 2026-09-15), four seconds in and then on
       a timer. index.html started it from fbCheckAdmin, which this page does
       not have - the gate above IS that check - so without this line the
       intake would have moved and never run.

       ONCE PER SESSION: this gate runs again on every auth change, and each
       pass would otherwise add another permanent timer.

       NOT FROM A DRAW. index.html's comment records why: a run started from
       the library screen's render replaced the screen under an in-flight
       publish. Offers keep arriving, so it loops, slow and quiet. */
    if (!VET_TIMER) {
      setTimeout(() => { intakeVetSoon(); }, 4000);
      VET_TIMER = setInterval(() => { intakeVetSoon(); }, A.L.INTAKE_EVERY);
    }
  }).catch(e => {
    said('The database would not say', sayError(e, 'That read was refused'));
  });
}

$('#out').onclick = () => firebase.auth().signOut().then(() => {
  A.admin = false; toast('Signed out');
});

/* ===================================================================
   THE LIBRARY: THE LAYER UNDER IT.

   The screens below this block came out of index.html whole. What they read
   did not, because what they read was a shelf-shaped app: a device catalog,
   a device's saved state, a phone's door to the lookup service. Each one is
   answered here for a page that has no shelf, and every answer that DIFFERS
   from index.html's says so in its own comment rather than pretending to be
   the same function.

   READ BEFORE JUDGING is the one rule this file cannot afford to get wrong,
   and it is the rule index.html learned the hard way four separate times:
   against a library that has not loaded every offer looks new, every entry
   looks incomplete, and "what is missing" answers EVERYTHING. The three
   needs* doors below are that rule, and nothing judges before they pass.
   =================================================================== */

/* The library cache, as index.html holds it minus one field: there is no
   LIB.admin here. Whether this account may write is A.admin, established
   once by the gate from admins/<uid>, and asking it twice under two names
   is how the two answers come to disagree. */
const LIB = { products: null, graves: {}, removed: {}, reviewed: null,
  ref: null, q: '', sub: null, picking: false, waiting: 0,
  /* The fill's own three, read by libraryFillStart and what it draws. */
  thinOnly: false, filling: false, fill: null };

/* Asked once, like index.html: a second caller waits for the read on its
   way rather than starting another, and must not call back into the draw
   that sent it. Both flags belong to the moved needs* doors below. */
let VERDICTS_ASKED = false;
let REF_ASKED = false;
let BRANDS_RICH = null, BRANDS_RICH_FOR = null;

/* ------------------------------------------------- the shared nodes */
const SHARED = 'bz-apps/whisky/shared';
Object.assign(NODE, {
  shared:   SHARED,
  products: SHARED + '/catalog/products',
  removed:  SHARED + '/removed',
  renamed:  SHARED + '/renamed',
  reviewed: SHARED + '/reviewed',
  registry: SHARED + '/ref',
  intake:   SHARED + '/intake',
  contrib:  'bz-apps/whisky/contrib',
  /* The shared barcode map. A contributor's pairings are filed under their
     own node and promoted into this one when an admin accepts them, which is
     what L.upcWriteTarget decides. */
  upc:      'bz-apps/whisky/upc'
});

function libRef() { return ref(NODE.products); }
function contribRef() { return ref(NODE.contrib); }

/* ------------------------------------------------- reading the library */

function libraryIsRead() {
  return !!LIB.products && !!Object.keys(LIB.products).length;
}

function libNow() {
  return { products: LIB.products || {}, graves: LIB.graves || {} };
}

/* THE LIBRARY, ITS REMOVALS AND ITS MERGE RECORD, in one place.

   MOVED: index.html reads the whole of `shared` for this, which also drags
   down `shared/ref` - a few megabytes of reference data nothing on that
   path wants. Four named children instead, because this page reads the
   registry on purpose and separately.

   A KEY CAN CARRY A DOT, so `renamed` is decoded through L.unFbKey on the
   way in. Read raw, an escaped key never matches and a merge looks as
   though it did nothing - which is exactly what cost BZ an afternoon on
   Octomore 16.1 (index.html's own comment, 2026-10-09). */
function withLibrary(then) {
  if (LIB.products) { then(); return; }
  Promise.all([
    libRef().once('value'),
    ref(NODE.removed).once('value').catch(() => null),
    ref(NODE.renamed).once('value').catch(() => null)
  ]).then(got => {
    LIB.products = A.L.libraryFromValue(got[0].val());
    LIB.removed = (got[1] && got[1].val()) || {};
    const graves = {};
    const rn = (got[2] && got[2].val()) || {};
    Object.keys(rn).forEach(k => {
      const rec = rn[k];
      const to = (rec && typeof rec === 'object') ? rec.to : rec;
      if (to && typeof to === 'string') graves[A.L.unFbKey(k)] = to;
    });
    LIB.graves = graves;
    appLog('library: ' + Object.keys(LIB.products).length + ' entries, '
      + Object.keys(LIB.removed).length + ' removed, '
      + Object.keys(LIB.graves).length + ' merged key(s)');
  }).catch(e => {
    /* SAID, NOT SWALLOWED. index.html logs this and carries on because the
       app has a shipped catalogue behind it; this page has nothing behind
       it, so a failed read must not look like an empty library. */
    appLog('the library would not load: ' + ((e && e.message) || e));
  }).then(() => then());
}

function needsLibraryFirst(redraw) {
  if (LIB.products || !A.user) return false;
  withLibrary(redraw);
  return true;
}

/* The verdicts, the registry and the three doors that make a read land
   before anything is judged all came across with the screens that use
   them - see THE CONTRADICTION SCAN and LOOKING UP WHAT IS MISSING below.
   They are not restated here: I wrote a second copy of all four during
   this build and JavaScript kept the later one silently, which is the
   fault rule 30d exists for happening inside the fix for it. */

/* THE TAXONOMY, WITH THE HOUSES IT DOES NOT STATE FILLED IN.

   MOVED: index.html learns the missing houses from S.catalog - the device's
   own shelf. There is no shelf here, so they are learned from the LIBRARY,
   which on this page is the better source anyway: it is the list the scan
   is judging, and a house spelled two ways in the library is exactly what
   the duplicate rules need the taxonomy for. */
function refBrands() {
  const raw = (LIB.ref && LIB.ref.brands) || null;
  if (!raw) return null;
  const from = LIB.products || {};
  if (BRANDS_RICH && BRANDS_RICH_FOR === from) return BRANDS_RICH;
  const learned = A.L.brandHouses(from, raw);
  const out = {};
  Object.keys(raw).forEach(k => {
    const row = raw[k];
    const key = A.L.rawNorm(String((row || {}).name || k.replace(/_/g, ' ')));
    if (row && !row.house && learned[key]) {
      out[k] = Object.assign({}, row, { house: learned[key] });
    } else {
      out[k] = row;
    }
  });
  BRANDS_RICH = out;
  BRANDS_RICH_FOR = from;
  return out;
}

/* ------------------------------------------------- this page's own bookkeeping

   The day's lookup spend and the fill ledger are a DEVICE's notes about what
   it has already asked, and this page is a different device from the phone.
   They live in this browser's storage, wrapped, because storage can be
   blocked and a refused read must not stop the page. */
const STORE = 'bottlefolio-admin';

function adminLoad() {
  try {
    const v = JSON.parse(localStorage.getItem(STORE) || '{}');
    A.tally = v.tally || {};
    A.ledger = v.ledger || {};
    A.budget = typeof v.budget === 'number' ? v.budget : 100;
    A.intakeTally = v.intakeTally || {};
  } catch (e) {
    A.tally = {}; A.ledger = {}; A.budget = 100; A.intakeTally = {};
  }
}

function adminSave() {
  try {
    localStorage.setItem(STORE, JSON.stringify({ tally: A.tally,
      ledger: A.ledger, budget: A.budget, intakeTally: A.intakeTally }));
  } catch (e) {
    appLog('could not remember this page\u2019s notes: '
      + ((e && e.message) || e));
  }
}

/* ------------------------------------------------- the lookup service

   ONE DOOR FROM THIS PAGE, and L.ACTIONS says so (id: "reach the lookup
   service from the admin page", through: adminService, where: admin.html).
   consistency.js fails any other fetch in this file that names the lookup
   address, which is the same rule index.html lives under and is checked the
   same way.

   NOT postWithRetry. That door carries a retry, a lane queue and a wake
   lock, and every one of those exists for a phone: Apps Script answers a
   POST with a redirect to a one-time url, Android suspends a backgrounded
   tab, the key expires and Google serves an HTML 404 instead of the answer.
   A desktop page somebody is watching has none of those failures, and 135
   lines of them copied here would be a second copy of the most-tested path
   in the app rather than a second door to the service. The declaration is
   what keeps this honest: it is named, it is checked, and it says plainly
   that it is less patient than the app's. */
async function adminService(q, ms, need) {
  if (navigator.onLine === false) throw new Error('you are offline');
  if (!A.lookupUrl) throw new Error(A.L.NO_SERVICE_SAY);
  /* The day's ceiling, before the call, exactly as askLookup does it: every
     lookup spends a real API key and a run over a long list could spend a
     month's budget. Said as a limit, not a failure. */
  if (!A.L.lookupAllowed(A.tally, A.L.todayISO())) {
    throw new Error(A.L.LOOKUP_LIMIT_SAY);
  }
  A.tally = A.L.countLookup(A.tally, A.L.todayISO(), 1);
  adminSave();
  const t0 = Date.now();
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || A.L.LOOKUP_MS);
  try {
    const r = await fetch(A.L.lookupUrl(A.lookupUrl, q, need),
      { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    const head = text.slice(0, 200).trim();
    /* A WEB PAGE IS A STALE DEPLOYMENT, said as that rather than as a parser
       complaining about a bracket. index.html's readService says the same
       thing in its own words; there is no engine door holding the sentence,
       so this is not a copy of one. */
    if (/^<!DOCTYPE|^<html/i.test(head)) {
      throw new Error('The lookup address returned a web page rather than '
        + 'data. Usually the deployment is out of date \u2014 Deploy \u203a '
        + 'Manage deployments \u203a pencil \u203a New version.');
    }
    const got = JSON.parse(text);
    appLog('service answered in ' + ((Date.now() - t0) / 1000).toFixed(1)
      + 's about ' + String(q).slice(0, 40) + ': '
      + (got && typeof got === 'object'
          ? (Object.keys(got).join(', ') || '(no fields)')
          : String(got).slice(0, 60)));
    return got;
  } catch (e) {
    if (e && (e.name === 'AbortError' || /abort/i.test(String(e.message)))) {
      appLog('service gave up after ' + ((Date.now() - t0) / 1000).toFixed(1)
        + 's on ' + String(q).slice(0, 40));
      throw new Error('the lookup did not answer in time');
    }
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

/* ONE NAME FOR IT. index.html reaches the service through askLookup, which
   adds the day's budget and offers back whatever it learned, over askService,
   which adds the timeout - two names and a door. Here the budget is inside
   the door and there is nothing to offer back (this page IS the library), so
   there is one function and the moved code calls it by name. */

/* ------------------------------------------------- small shared sugar

   Sugar, not decisions: a download, a confirmation, a progress line. Each is
   this page's own because index.html's are wound into its phone shell, and
   none of them answers a question about whiskey. */
function saveFile(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

function downloadCsv(name, cols, rows) {
  saveFile(name + '-' + A.L.todayISO() + '.csv',
    new Blob([A.L.toCsv(cols, rows)], { type: 'text/csv' }));
  return rows.length;
}

/* NAMES WHAT GOES, not "are you sure": a confirmation that does not say
   what it is about is a reflex rather than a decision. */
function confirmDelete(what, onYes) {
  openModal('Remove ' + what + '?', m => {
    m.appendChild(el('div', 'sub', 'This cannot be undone.'));
    const row = el('div', 'actionrow');
    row.style.marginTop = '12px';
    const go = el('button', 'btn', 'Remove');
    go.onclick = () => { closeModal(); onYes(); };
    const no = el('button', 'btn ghost', 'Keep it');
    no.onclick = closeModal;
    row.appendChild(go);
    row.appendChild(no);
    m.appendChild(row);
  });
}

/* HOW FULL AN ENTRY IS, as a number rather than the app's drawn bottle: the
   drawing is part of index.html's visual system and this page is not. */
function completeBottle(pct) {
  const w = el('div', 'pf', pct + '%');
  w.title = pct + '% complete';
  return w;
}

function libraryStandLine(card, all) {
  card.appendChild(el('div', 'sub', A.L.libraryLine(
    A.L.libraryLists(A.L.libraryRows(all), A.ledger || {}, A.L.todayISO()))));
}

/* ------------------------------------------------- the four surfaces */

/* DRAWN WHEN IT IS FIRST OPENED, and kept afterwards: a judgement made on
   the scan is still there when you come back from the offers queue, which
   is the whole reason these are sections and not pages. */
const DREW = {};
const SECTIONS = {
  people: renderPeople,
  library: () => drawLibrary(),
  offers: () => drawOffers(),
  scan: () => openLibraryCleanUp()
};

function showSection(name) {
  Object.keys(SECTIONS).forEach(k => {
    const sec = $('#sec-' + k);
    if (sec) sec.classList.toggle('on', k === name);
  });
  Array.prototype.forEach.call(document.querySelectorAll('#tabs .tab'),
    t => t.classList.toggle('on', t.getAttribute('data-go') === name));
  if (!DREW[name]) { DREW[name] = true; SECTIONS[name](); }
}

/* REDRAW ONE, whatever is showing. The moved code calls
   renderLibraryScreen() after a write; here that means "the library
   surface", and the scan has its own rescan. */
function renderLibraryScreen() {
  if (DREW.library) drawLibrary();
  if (DREW.offers) drawOffers();
  countOffers();
}

/* WHAT IS WAITING, on the tab. index.html put this on a tab badge for the
   admin only; here every reader is an admin, so it is simply the count. */
function countOffers() {
  if (!A.user) return Promise.resolve(0);
  return contribRef().once('value').then(s => {
    let n = 0;
    offerRows(s).forEach(r => { if (!r.entry.dropped) n++; });
    LIB.waiting = n;
    const el2 = $('#offerN');
    if (el2) el2.textContent = n ? String(n) : '';
    return n;
  }).catch(() => 0);
}

function drawOffers() {
  const box = $('#sec-offers');
  box.innerHTML = '';
  if (needsLibraryFirst(() => drawOffers())) {
    box.appendChild(el('div', 'empty', 'Reading the library\u2026'));
    return;
  }
  renderContrib(box);
}

/* ===================================================================
   PEOPLE. Moved out of index.html's Diagnostics screen on 2026-10-27,
   unchanged except where it reached for something the app has and this
   page does not; each of those is marked MOVED.
   =================================================================== */

const PEOPLE_DIAGS = {};
/* Which way each share runs, read once per open. shareParties finds
   records in either direction - including somebody who granted you and
   never published a stat, precisely whose shelf will not open. */
const PEOPLE_SHARES = { rows: [], asked: false };

/* WHICH WAY EACH SHARE RUNS, THROUGH L.shareHealth AND NOTHING ELSE. That is
   the one thing that turns an audit row into a verdict, it is in the engine
   and it is tested. This used to be worked out again at the call site, from
   two field names shareAudit does not write and nothing else does either,
   so both verdicts came out false for everybody and every person in the
   admin list read "no sharing" while sharing both ways (BZ, 2026-10-04: "no
   sharing? yet we are buddies"). A decision asked in two places had the
   wrong answer in one of them, which is what rule 30d is for. */
function shareVerdicts(rows) {
  return (rows || []).map(r => {
    const health = A.L.shareHealth(r);
    return Object.assign({}, r, {
      theySeeYours: health.theyCanSeeMine,
      youSeeTheirs: health.iCanSeeTheirs
    });
  });
}

function shareAudit(uids) {
  if (!A.user) return Promise.resolve([]);
  const me = A.user.uid;
  const one = uid => Promise.all([
    ref(NODE.shares).child(me).child(uid).once('value')
      .then(s => !!s.val()).catch(() => null),
    ref(NODE.sharedWith).child(uid).child(me).once('value')
      .then(s => !!s.val()).catch(() => null),
    ref(NODE.shares).child(uid).child(me).once('value')
      .then(s => !!s.val()).catch(() => null),
    ref(NODE.sharedWith).child(me).child(uid).once('value')
      .then(s => !!s.val()).catch(() => null)
  ]).then(([outGrant, outIndex, inGrant, inIndex]) => ({
    uid: uid, outGrant: outGrant, outIndex: outIndex,
    inGrant: inGrant, inIndex: inIndex,
    /* null means the read was refused, which is a different thing from
       false and must never be repaired as though it were. */
    unreadable: [outGrant, outIndex, inGrant, inIndex]
      .filter(v => v === null).length
  }));
  return Promise.all((uids || []).map(one));
}

/* Everybody this account has any sharing record with, from both
   directions, so a person whose index went missing is still found.
   MOVED: the app also folded in SHARED.shelves and SHARED.outList, which are
   buddy lists it has already loaded. This page loads no shelves, so the two
   nodes are the whole answer here - fewer sources, same question. */
function shareParties() {
  if (!A.user) return Promise.resolve([]);
  const me = A.user.uid;
  return Promise.all([
    ref(NODE.shares).child(me).once('value')
      .then(s => Object.keys(s.val() || {})).catch(() => []),
    ref(NODE.sharedWith).child(me).once('value')
      .then(s => Object.keys(s.val() || {})).catch(() => [])
  ]).then(([mine, theirs]) => {
    const all = {};
    mine.concat(theirs).forEach(u => { if (u && u !== me) all[u] = 1; });
    return Object.keys(all);
  });
}

function shareRepair(row) {
  /* MOVED: the app clears its CHILD_CACHE here. This page keeps no such
     cache, so there is nothing to forget. */
  const me = A.user.uid;
  const ops = A.L.shareRepairOps(row);
  return Promise.all(ops.map(op => {
    const viewer = op.viewer === 'me' ? me : op.viewer;
    const owner = op.owner === 'me' ? me : op.owner;
    const r = ref(NODE.sharedWith).child(viewer).child(owner);
    return op.set ? r.set({ at: Date.now() }) : r.remove();
  })).then(() => ops.length);
}

// Suspending somebody removes the REGISTRY ENTRY, not their whisky, which
// lives in their own account; they reappear on their next sign-in. Said
// plainly rather than implying more power than it has. Enforced client-side
// at sign-in: it stops use of the app, not somebody reading their own data,
// which they are entitled to.
function setSuspended(uid, off) {
  return ref(NODE.stats).child(uid).child('suspended').set(!!off)
    .then(() => { appLog((off ? 'suspended ' : 'restored ') + uid.slice(0, 8)); });
}

function renderPeople() {
  const box = $('#sec-people');
  box.innerHTML = '';
  const h = el('div', 'rs', 'People');
  h.id = 'peopleHead';
  box.appendChild(h);
  renderUsers(box);
}

function renderUsers(box) {
  /* ONE CARD, REDRAWN IN PLACE: always directly after the People heading,
     which cannot be wrong however late anything arrives. */
  const old = box.querySelector('#everybodyCard');
  if (old) old.remove();
  const putBack = node => {
    const head = box.querySelector('#peopleHead');
    if (head && head.parentNode) {
      head.parentNode.insertBefore(node, head.nextSibling);
    } else {
      box.appendChild(node);
    }
  };
  /* EVERYBODY WITH AN ACCOUNT, INLINE, on the tested logic. */
  const card = el('div', 'sheet');
  card.id = 'everybodyCard';
  card.appendChild(el('h3', null, 'Everyone'));
  card.appendChild(el('div', 'sub', A.user ? 'Loading…' : 'Sign in first.'));
  putBack(card);
  if (!A.user || typeof firebase === 'undefined') return;

  Promise.all([
    ref(NODE.stats).once('value').then(sn => sn.val() || {}).catch(() => null),
    ref(NODE.directory).once('value').then(sn => sn.val() || {}).catch(() => ({}))
  ]).then(([stats, dir]) => {
    card.innerHTML = '';
    card.appendChild(el('h3', null, 'Everyone'));
    if (stats === null) {
      card.appendChild(el('div', 'sub',
        'The database would not let this account read them.'));
      return;
    }
    /* THE DIRECTORY ARRIVES AS A MAP KEYED BY UID and L.adminPeople wants
       rows of {uid, name}. Converted here, where the two meet, rather than
       teaching the helper a second shape. */
    const dirRows = Object.keys(dir || {}).map(uid =>
      Object.assign({ uid: uid }, (dir || {})[uid] || {}));
    /* EVERYBODY IS THE LIST, with sharing and diagnostics in it: one row per
       person. A person has a diagnostic only once their DEVICE has
       published, so separate cards appeared to disagree. */
    const people = A.L.peopleRows({
      stats: stats, directory: dirRows,
      /* Filled by the audit below, the only thing that knows which way a
         share runs. */
      shares: (PEOPLE_SHARES.rows || []),
      /* Only the ones that actually published: a recorded null means
         asked and nothing there. */
      diagUids: Object.keys(PEOPLE_DIAGS).filter(u => PEOPLE_DIAGS[u]),
      me: A.user.uid, now: Date.now() });

    /* THE SHARING, ONCE. shareParties is the only thing that
       enumerates both directions, and shareAudit is the only thing
       that says which way each one actually runs. */
    if (!PEOPLE_SHARES.asked) {
      PEOPLE_SHARES.asked = true;
      shareParties().then(uids => shareAudit(uids))
        .then(rows => {
          PEOPLE_SHARES.rows = shareVerdicts(rows);
          renderUsers(box);
        })
        .catch(() => {});
    }

    /* AND EACH PERSON'S REPORT, one node at a time: Firebase rules do not
       cascade upward, so the collection read is refused even for an admin.
       When one arrives, that person's row gains its button. */
    people.forEach(pn => {
      if (PEOPLE_DIAGS[pn.uid] !== undefined) return;
      ref(NODE.diagnostics).child(pn.uid).once('value')
        .then(sn => {
          /* NULL IS AN ANSWER TOO. Storing only hits would re-ask everybody
             without a report on each redraw, and a redraw is triggered BY an
             answer - a loop hammering Firebase while the screen is open. */
          PEOPLE_DIAGS[pn.uid] = sn.val() || null;
          if (PEOPLE_DIAGS[pn.uid]) renderUsers(box);
        })
        .catch(() => { PEOPLE_DIAGS[pn.uid] = null; });
    });
    if (!people.length) {
      card.appendChild(el('div', 'sub', 'Nobody has reported yet.'));
      return;
    }
    /* ONLY SOMEBODY WHO HAS ACTUALLY REPORTED A VERSION can be on an older
       one. This counted `x.version !== A.version`, so an account that has
       never synced - version '' - was counted as being on an older build,
       and the card said "3 people, 2 on an older version" while one of the
       rows said "no report". The screen contradicted itself, which is what
       answers.js fails a build for. Carried over from index.html on
       2026-10-27 and found by admin.js on the way through. */
    const stale = people.filter(x => x.version && x.version !== A.version).length;
    card.appendChild(el('div', 'sub', people.length + ' '
      + (people.length === 1 ? 'person' : 'people')
      + (stale ? ', ' + stale + ' on an older version' : ', all current')
      + '. Counts only — nobody’s bottles are read here.'));

    people.forEach(pn => {
      const item = el('div', 'item');
      const left = el('div');
      const nm = el('div', 'nm', pn.name || '(no name)');
      if (pn.uid === A.user.uid) {
        nm.appendChild(el('span', 'pourtag blend', 'you'));
      }
      if (pn.version && pn.version !== A.version) {
        nm.appendChild(el('span', 'pourtag wish', 'v' + pn.version));
      }
      /* A MARK ON THE NAME (BZ): a tag is seen without reading, on the row an
         admin scans for whoever reported a problem. */
      if (pn.hasDiag) {
        nm.appendChild(el('span', 'pourtag', 'diag'));
      }
      /* And a person whose device has never published says so, rather than
         leaving a gap. */
      if (!pn.hasDiag && pn.uid !== A.user.uid) {
        nm.appendChild(el('span', 'pourtag quiet', 'no report'));
      }
      left.appendChild(nm);
      /* Shelf size, last visit, sharing direction, diagnostic: one line. */
      left.appendChild(el('div', 'sub', A.L.peopleLine(pn)));
      /* THE EMAIL (BZ): a name is what somebody chose to show, an email is who
         they are, and an admin looking at two rows with one name needs it. */
      if (pn.email && pn.email !== pn.name) {
        const em = el('div', 'src mono', pn.email);
        left.appendChild(em);
      }
      /* THE UID, because a name does not identify an account, two rows can
         share one, and Remove wipes a shelf with no undo (BZ).
         THE SHARING IS ON THE ROW, not behind a press (BZ): it is one line.
         What needs room or acts - the four records with a mend, and the
         published report - opens from the person. */
      const sh = (PEOPLE_SHARES.rows || []).filter(r => r.uid === pn.uid)[0];
      if (sh) {
        const health = A.L.shareHealth(sh);
        if (!health.whole) {
          const bad = el('div', 'src bad');
          bad.textContent = health.faults.map(f => f.what).join(' · ');
          left.appendChild(bad);
        }
      }
      if (pn.hasDiag || (sh && !A.L.shareHealth(sh).whole)) {
        const more = el('button', 'chip quiet',
          pn.hasDiag ? 'Report and repair' : 'Repair it');
        more.style.marginTop = '4px';
        more.onclick = ev => { ev.stopPropagation(); openPersonSheet(pn); };
        left.appendChild(more);
      }
      const idl = el('div', 'src mono', pn.uid
        + (pn.uid === A.user.uid ? '  — this sign-in' : ''));
      left.appendChild(idl);
      item.appendChild(left);
      if (pn.uid !== A.user.uid) {
        /* SUSPEND, a live feature checked on sign-in; this is its only control. */
        const susp = el('button', 'chip');
        const off = !!pn.suspended;
        susp.textContent = off ? 'Restore' : 'Suspend';
        susp.onclick = () => {
          susp.disabled = true;
          setSuspended(pn.uid, !off)
            .then(() => renderPeople())
            .catch(e => { susp.disabled = false; toast(sayError(e)); });
        };
        /* ONE GROUP ON THE RIGHT (BZ: remove small and next to suspend). */
        const acts = el('div', 'rowacts');
        acts.appendChild(susp);
        const rm = el('button', 'chip', 'Remove');
        rm.onclick = () => confirmRemovePerson(pn);
        /* Quieter than Suspend: suspending is reversible, removing is not. */
        rm.classList.add('quiet');
        acts.appendChild(rm);
        item.appendChild(acts);
      }
      card.appendChild(item);
    });
  });
}

/* ONE PERSON, EVERYTHING KNOWN ABOUT THEM, including the sharing audit:
   the only thing that can tell somebody why a shelf will not open, and it
   can mend it. Read, never inferred: a refused read is reported as refused
   rather than as an absence, because repairing an absence you cannot see
   would delete somebody's access on a guess. */
function openPersonSheet(pn) {
  openModal(pn.name || 'Someone', m => {
    m.appendChild(el('div', 'sub', A.L.peopleLine(pn)));

    const shareBox = el('div');
    shareBox.appendChild(el('div', 'src', 'Reading the sharing…'));
    m.appendChild(shareBox);

    shareAudit([pn.uid]).then(rows => {
      shareBox.innerHTML = '';
      const row = (rows || [])[0];
      if (!row) {
        shareBox.appendChild(el('div', 'src', 'No sharing records either way.'));
        return;
      }
      const h = A.L.shareHealth(row);
      shareBox.appendChild(el('div', 'nm',
        h.whole ? 'Sharing is intact'
          : (h.faults.length + ' thing'
             + (h.faults.length === 1 ? '' : 's') + ' to mend')));
      h.faults.forEach(f => {
        shareBox.appendChild(el('div', 'src', f.what));
      });
      if (!h.whole && h.faults.some(f => f.mine)) {
        /* ONLY WHAT THIS ACCOUNT OWNS. A uid-keyed node is writable by
           its owner alone, so a fault on their side is theirs to fix and
           saying so is more use than a button that fails. */
        const fix = el('button', 'btn wide', 'Mend my side');
        fix.style.marginTop = '8px';
        fix.onclick = () => {
          fix.disabled = true;
          shareRepair(row)
            .then(() => { toast('Mended'); closeModal(); renderPeople(); })
            .catch(e => { fix.disabled = false; toast(sayError(e)); });
        };
        shareBox.appendChild(fix);

function removePersonData(p) {
  const db = firebase.database();
  const uid = p.uid;
  Promise.all([
    db.ref(NODE.shares + '/' + uid).once('value')
      .then(s => Object.keys(s.val() || {})).catch(() => []),
    db.ref(NODE.directory).once('value')
      .then(s => Object.keys(s.val() || {})).catch(() => []),
    /* Who has asked THIS account for access. Needed BY NAME because each
       ask must be nulled as its own child: the parent has no write rule,
       and one refused path refuses the whole update. */
    db.ref(NODE.requests + '/' + uid).once('value')
      .then(s => Object.keys(s.val() || {})).catch(() => []),
    /* AND WHO SHARED WITH THEM. Those records live under the GIVER, so
       nothing under this account points at them and the wipe walked straight
       past: the giver's buddy list went on naming somebody with no shelf. */
    db.ref(NODE.sharedWith + '/' + uid).once('value')
      .then(s => Object.keys(s.val() || {})).catch(() => [])
  ]).then(([sharedWith, everyone, askedBy, sharedFrom]) => {
    const wipe = A.L.accountWipe(uid, sharedWith, everyone, askedBy, sharedFrom);
    /* The tombstone goes in the SAME update as the wipe. Their device still
       holds the shelf and would push it back on the next sign-in; the
       tombstone tells that device to start empty instead. */
    wipe['wiped/' + uid] = Date.now();
    return db.ref(NODE.root).update(A.L.fbEncodePaths(wipe));
  }).then(() => {
    appLog('admin removed account ' + uid);
    closeModal();
    toast('Removed — delete their sign-in in the Firebase console');
    /* MOVED: the app redrew Buddies here. This page has one screen. */
    PEOPLE_SHARES.asked = false;
    PEOPLE_SHARES.rows = [];
    renderPeople();
  }).catch(e => {
    appLog('admin remove refused: ' + ((e && e.message) || e));
    closeModal();
    /* SAY WHAT HAPPENED: the database's own words, not a guess at the cause
       (a hardcoded "out-of-date rules" excuse once sent BZ the wrong way). */
    toast(sayError(e, 'That was refused'));
  });
}


/* ===================================================================
   THE ADMIN'S WAY INTO THE LIBRARY, and the sugar the moved code names.
   =================================================================== */

/* SAYING IT IS WORKING. index.html's working() is a ticking overlay with
   rotating phrases, built for somebody holding a phone at a bar; this is the
   same job for a desktop tool - one line, in place, that says what is
   happening and goes when it stops. Called with no argument to clear, which
   is the shape the moved code expects. */
function working(msg) {
  let w = $('#adminWorking');
  if (!msg) { if (w) w.remove(); return; }
  if (!w) {
    w = el('div', 'looknote');
    w.id = 'adminWorking';
    const body = $('#body');
    body.insertBefore(w, body.firstChild.nextSibling);
  }
  w.textContent = msg;
}

/* A LABELLED INPUT. index.html marks the required ones with a star off
   REQUIRED_FIELDS; the only required field is the name, and the editor
   refuses to save without one anyway, so it is said rather than starred. */
function fieldRow(label, name, value, attrs) {
  const l = el('label', null, label + (name === 'name' ? ' (needed)' : ''));
  const i = document.createElement('input');
  i.className = 'field';
  i.name = name;
  i.value = (value === null || value === undefined) ? '' : value;
  Object.keys(attrs || {}).forEach(a => i.setAttribute(a, attrs[a]));
  l.appendChild(i);
  return l;
}

/* THE LIBRARY, TO WORK ON.

   READ BEFORE DRAWING, which on this surface means: do not draw a score, a
   count or a "nothing matches" over a library that has not arrived. Against
   an unread library every entry is missing everything and the page says the
   library is 0% complete, which is the oldest fault in this file's family.

   EVERY ROW OPENS THE EDITOR. That is the difference between this and the
   browse in the app, and it is why both exist: the question "which entries
   match this?" is asked once, of A.L.searchLibrary, by both pages. */
function drawLibrary() {
  const box = $('#sec-library');
  box.innerHTML = '';
  if (needsLibraryFirst(() => drawLibrary())) {
    box.appendChild(el('div', 'empty', 'Reading the library\u2026'));
    return;
  }
  const all = LIB.products || {};
  const n = Object.keys(all).length;
  const card = el('div', 'sheet');
  box.appendChild(card);

  /* A SCORE, NOT JUST A COUNT (BZ): one missing field is not four, and the
     average says how far along the library is. */
  const scores = Object.values(all).map(p => A.L.entryScore(p));
  const avg = scores.length
    ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 100;
  card.appendChild(el('h3', null, n + ' entries \u00b7 ' + avg + '% complete'));
  libraryStandLine(card, all);

  const qrow = el('div', 'lookrow');
  qrow.style.marginTop = '9px';
  const q = document.createElement('input');
  q.className = 'field';
  q.placeholder = 'Search all ' + n + ' by name, distillery, cask or region';
  q.value = LIB.q;
  q.oninput = () => { LIB.q = q.value; list(); };
  qrow.appendChild(q);
  libraryPickToggle(qrow, () => list());
  card.appendChild(qrow);

  const out = el('div', 'scrollbox');
  out.style.cssText = 'max-height:60vh;overflow-y:auto;margin-top:9px';
  card.appendChild(out);

  /* EXPORT AND IMPORT, at the foot of the library it reads. */
  card.appendChild(libraryDataRow());

  const list = () => {
    out.innerHTML = '';
    /* NOTHING SEARCHED: the way in, not the first sixty alphabetically. */
    if (!LIB.q && !LIB.sub && !LIB.picking) {
      const by = {};
      Object.values(all).forEach(p => {
        const k = p.sub || 'other';
        by[k] = (by[k] || 0) + 1;
      });
      const tiles = el('div', 'tiles');
      tiles.style.marginTop = '9px';
      Object.entries(by).sort((a, b) => b[1] - a[1]).forEach(pair => {
        const t = el('button', 'tile');
        t.appendChild(el('div', 'v', String(pair[1])));
        t.appendChild(el('div', 'l', A.L.titleCase(pair[0])));
        t.onclick = () => { LIB.sub = pair[0]; list(); };
        tiles.appendChild(t);
      });
      out.appendChild(tiles);
      return;
    }
    if (LIB.sub) {
      const back = el('button', 'chip', '\u2039 All types');
      back.style.marginBottom = '9px';
      back.onclick = () => { LIB.sub = null; list(); };
      out.appendChild(back);
    }
    /* A SEARCH LEAVES THE TYPE BEHIND: typing Lagavulin while on Bourbon
       means the whole library. */
    const pool = (LIB.sub && !LIB.q)
      ? Object.fromEntries(Object.entries(all)
          .filter(kv => (kv[1].sub || 'other') === LIB.sub))
      : all;
    const hits = A.L.searchLibrary(pool, LIB.q, 60);
    if (!hits.length) {
      out.appendChild(el('div', 'empty', 'Nothing matches.'));
      return;
    }
    if (LIB.picking) { libraryTakeOutPicker(out, hits); return; }
    hits.forEach(p => {
      const gaps = A.L.libraryGaps(p);
      const r = el('button', 'item pair');
      r.style.cssText = 'width:100%;text-align:left';
      const left = el('div');
      left.appendChild(el('div', 'nm', p.name));
      left.appendChild(el('div', 'sub',
        [p.dist, p.proof ? p.proof + ' proof' : null, p.fin]
          .filter(Boolean).join(' \u00b7 ') || '\u2014'));
      if (gaps.length) {
        left.appendChild(el('div', 'src', 'no ' + gaps.join(', no ')));
      }
      r.appendChild(left);
      r.appendChild(gaps.length ? completeBottle(A.L.entryScore(p))
                                : el('div', 'pf', ''));
      r.onclick = () => editLibraryEntry(p, () => drawLibrary());
      out.appendChild(r);
    });
    if (hits.length === 60) {
      out.appendChild(el('div', 'src', LIB.sub
        ? 'First 60 of ' + Object.keys(pool).length + '. Search to narrow it.'
        : 'First 60. Search, or pick a type.'));
    }
  };
  list();
}

/* ===================================================================
   THE LIBRARY ADMIN, MOVED OUT OF index.html ON 2026-10-27.

   BZ: "we need to separate out admin functions and solve for that", then,
   once the shape of it was measured: move it whole. It does not split -
   every cut tried duplicated a decision. pickLibraryEntry is wanted by the
   entry editor AND the offers queue; libraryMergeWrite by the editor AND the
   scan; and the scan is the only door to the fill, which is the only thing
   here that needs the lookup service. Eighty-seven functions, one web.

   WHAT CAME ACROSS UNCHANGED is most of it. These screens were right; they
   were only in the wrong file. Where one of them has been adapted the change
   is marked MOVED with the reason, and the reason is always the same shape:
   this page has no shelf, no phone, and no local state but its own notes.

   WHAT INDEX.HTML KEPT is everything that reads or writes a shelf. An
   admin's own shelf facts reach the library the way everybody else's do now,
   by being offered - which is what made the split possible at all.
   =================================================================== */

/* ====================================================================
   THE OFFERS QUEUE
   ==================================================================== */

/* ---- renderContrib   index.html 48035-48103 ---- */
function renderContrib(box) {
  const card = el('div', 'sheet');
  card.appendChild(el('h3', null, 'Offers'));
  box.appendChild(card);
  if (!A.user) return;

  /* THE LIBRARY FIRST. Against a library this device has not loaded every
     offer is new, and Add would write offers over existing entries. */
  Promise.all([readOffers(), libraryLoad()]).then(([rows]) => {
    /* EVERY OFFER, named or not - an unreadable one can still be thrown away.
       Read with only this app's verdicts on them. */
    const stale = [];
    /* HELD, NOT ERASED. A dropped offer keeps its place for a fortnight
       (BZ's choice); after that it goes on the next look. */
    rows.forEach(row => {
      const d = row.entry.dropped;
      if (!d) return;
      if (A.L.intakeExpired(d.at, Date.now())) stale.push(row);
      else row.dropped = d;
    });
    stale.forEach(r => {
      contribRef().child(r.uid).child(r.slug).remove().catch(() => {});
      intakeStoreRef().child(r.uid).child(r.slug).remove().catch(() => {});
    });
    const live = rows.filter(r => !r.dropped
      && stale.indexOf(r) < 0);
    card.innerHTML = '';
    card.appendChild(el('h3', null, 'Offers'));
    const auto = A.L.autoAddedRecently(LIB.products || {}, Date.now());
    const spelled = A.L.autoSpelledRecently(LIB.products || {}, Date.now());
    if (!Object.keys(LIB.products || {}).length) {
      card.appendChild(el('div', 'sub warn2', 'The library did not load, so '
        + 'nothing here can be judged yet. Open this screen again in a '
        + 'moment.'));
      return;
    }
    /* HELD ONCE, for both branches: it was worked out inside the empty one and
       again after the plan, and the second copy is what the fold now reads. */
    const held = rows.filter(r => r.dropped);
    if (!live.length) {
      /* Shown only when something is here (BZ, 2026-09-16). */
      if (!auto.length && !held.length && !spelled.length) {
        card.remove(); return;
      }
      contribSettled(card, auto, spelled, held);
      return;
    }
    const plan = A.L.intakePlan(live, { library: LIB.products || {},
      removed: LIB.removed || {}, graves: LIB.graves });
    contribPlan(card, plan);
    contribSettled(card, auto, spelled, held, plan);
  }).catch(e => {
    card.innerHTML = '';
    card.appendChild(el('h3', null, 'Offers'));
    /* "NOT AN ADMIN" ONLY WHEN IT IS. A timeout or a sorting fault is not a
       missing permission, and saying so sends somebody to check keys they
       have. */
    const raw = String((e && (e.code || e.message)) || e);
    appLog('offered queue failed: ' + raw);
    card.appendChild(el('div', 'sub', /permission/i.test(raw)
      ? 'Not an admin.'
      : 'The offers did not load \u2014 ' + A.L.plainError(e) + ' Open this '
        + 'screen again to retry.'));
  });
}

/* THE LIBRARY AND ITS REMOVALS, LOADED TOGETHER. Everything that judges an
   offer asks both; with the library loaded alone, every guard judges
   against an empty removal list and a removed bottle can come back. */

/* ---- libraryLoad   index.html 48104-48117 ---- */
function libraryLoad() {
  if (LIB.products && LIB.removed) return Promise.resolve();
  return Promise.all([libRef().once('value'),
    ref(NODE.removed).once('value')])
    .then(got => {
      LIB.products = A.L.libraryFromValue(got[0].val());
      LIB.removed = got[1].val() || {};
    });
}

/* THE THREE PILES, AND ONLY ONE OF THEM IS A LIST TO WORK THROUGH (BZ,
   2026-09-15): the app accepts or rejects most, and a person deals with
   the rest. Since 2026-09-16 it acts on its own (intakeVetRun): what
   reaches this screen is what the rules and the search could not settle. */

/* ---- contribPlan   index.html 48118-48137 ---- */
function contribPlan(card, plan) {
  card.appendChild(el('div', 'sub', A.L.intakeSay(plan)));
  /* NO BUTTONS FOR WHAT HAPPENS ON ITS OWN (BZ, 2026-09-16). Offers are looked
     up, added and dropped by the timed check (intakeVetRun).

     AND NO LISTS EITHER (BZ, 2026-10-01). What is going in next is the same kind
     of thing as what went in last week - a record, not a question - so it sits
     with them, one fold in. What is left here is the rows that need a person. */
  const yours = plan.yours || plan.ask;
  if (yours.length) {
    card.appendChild(el('div', 'rs', 'These need you (' + yours.length + ')'));
    contribPicker(card, yours);
  }
}

/* PICK THEM OFF IN ONE PRESS, NOT ONE ROW AT A TIME (BZ, 2026-09-15). A
   contributor who imports a cellar must not turn review into an evening.
   Everything starts selected, because the common case is agreeing with the
   sorting, and the row itself is the target: a checkbox beside a chip
   beside a name is three things competing for a thumb. */

/* ---- contribPicker   index.html 48138-48154 ---- */
function contribPicker(card, list) {
  selectRows(card, list, {
    picked: true,
    row: (x, onPick) => contribRow(x.row, x, onPick),
    actions: [
      ['\u002b Add selected', (chosen, b) =>
        contribAddMany(chosen.filter(x => x.product), b)],
      ['\u00d7 Drop selected', (chosen, b) => contribDropMany(chosen, b)]
    ]
  });
}

/* PICK SEVERAL, ACT ONCE. BZ, 2026-09-15: accept and deny efficiently, not
   row by row. Every list in the offer queue goes through this one picker:
   tap rows, then one button acts on what is ticked.
   opts: picked (start ticked), row(item, onPick) -> element,
         actions [[label, run(chosenItems, button)]] */

/* ---- selectRows   index.html 48155-48194 ---- */
function selectRows(card, list, opts) {
  const picked = list.map(() => !!opts.picked);
  const bar = el('div');
  bar.style.cssText = 'display:flex;gap:8px;align-items:center;'
    + 'flex-wrap:wrap;margin:6px 0';
  const count = el('div', 'sub');
  const acts = opts.actions.map(([label, run]) => {
    const b = el('button', 'chip', label);
    b.onclick = () => run(list.filter((x, i) => picked[i]), b);
    return b;
  });
  const all = el('button', 'chip ghost', 'All');
  const none = el('button', 'chip ghost', 'None');
  acts.concat([all, none]).forEach(b => bar.appendChild(b));
  bar.appendChild(count);
  card.appendChild(bar);

  const rows = list.map((x, i) => opts.row(x, () => {
    picked[i] = !picked[i];
    paint();
  }));
  rows.forEach(r => card.appendChild(r));

  function paint() {
    rows.forEach((r, i) => {
      r.dataset.on = picked[i] ? '1' : '';
      r.style.opacity = picked[i] ? '1' : '.45';
      const box = r.querySelector('.pickbox');
      if (box) box.textContent = picked[i] ? '\u2611' : '\u2610';
    });
    const k = picked.filter(Boolean).length;
    count.textContent = k + ' of ' + list.length + ' selected';
    acts.forEach(b => { b.disabled = !k; });
  }
  all.onclick = () => { picked.fill(true); paint(); };
  none.onclick = () => { picked.fill(false); paint(); };
  paint();
}

/* A name with its tick in front, on one line (selectRows paints the tick). */

/* ---- pickName   index.html 48195-48204 ---- */
function pickName(cls, name) {
  const nm = el('div', cls);
  const box = el('span', 'pickbox', '\u2610');
  box.style.cssText = 'margin-right:7px;font-size:16px;line-height:1';
  nm.appendChild(box);
  nm.appendChild(document.createTextNode(name));
  return nm;
}

/* A plain row for the picker: a tick, a name and one line under it. */

/* ---- pickRow   index.html 48205-48228 ---- */
function pickRow(name, line, onPick) {
  const item = el('div', 'item');
  item.style.cursor = 'pointer';
  item.onclick = onPick;
  const left = el('div');
  left.appendChild(pickName('nm oneline', name));
  if (line) left.appendChild(el('div', 'sub', line));
  item.appendChild(left);
  return item;
}

/* ============ VETTING AS THE OFFERS ARRIVE ==========================
   BZ, 2026-09-15: look up before presenting. Runs for an admin, quietly, a
   few at a time, and writes what it finds to the admin-only store - done
   once for everybody, so a redraw costs nothing.

   It stops at its own budget rather than the day's allowance, so it never
   eats lookups somebody wanted for themselves. Everything it spends is in
   the log, named. The verdicts and lookups are the same ones the screen
   would run; only the moment has changed. */
let VETTING = false;

let VET_TIMER = null;


/* ---- contribWhy   index.html 48482-48503 ---- */
function contribWhy(card, list, title) {
  const more = el('details');
  more.style.marginTop = '4px';
  const sum = el('summary', 'sub', title + ' (' + list.length + ')');
  more.appendChild(sum);

  });
  if (list.length > 200) {

  }

}

/* WHAT WENT IN ON ITS OWN, AND TAKING IT BACK. Acting without a press means
   a wrong bar must be cheap to undo: a fortnight of additions, one press
   for all. Taking one back is a library removal, tombstone and all, so the
   same offer does not walk straight back in on the next run. */

/* ---- contribAutoAdded   index.html 48504-48524 ---- */
function contribAutoAdded(card, auto) {
  const more = el('details');
  more.style.marginTop = '9px';
  more.appendChild(el('summary', 'sub', auto.length + ' went in on their '
    + 'own in the last ' + A.L.INTAKE_HOLD_DAYS + ' days'));

      p.proof ? p.proof + ' proof' : null].filter(Boolean).join(' · '),

      + (chosen.length === 1 ? ' entry' : ' entries') + ' added on their own',
      () => libraryTakeOut(chosen, b, 'taken back after going in on its own'))]]
  });

}

/* WHAT THE HOUSE RULE RESPELLED, and putting it back. The same fortnight and
   the same shape as what went in on its own, because something that acts
   without being asked has to be reviewable - but the undo RESTORES THE
   SPELLING rather than deleting the entry: getting a distillery wrong is not
   a reason to take somebody's bottle out of the library. */

/* ---- contribRespelled   index.html 48525-48539 ---- */
function contribRespelled(card, rows) {
  const more = el('details');
  more.style.marginTop = '9px';
  more.appendChild(el('summary', 'sub', rows.length
    + (rows.length === 1 ? ' house was' : ' houses were')
    + ' spelled like the rest in the last ' + A.L.INTAKE_HOLD_DAYS + ' days'));
  selectRows(more, rows, {
    row: (p, onPick) => pickRow(p.name || p._key,
      'now ' + p.dist + ', was ' + ((p.autoSpell || {}).was || '?'), onPick),
    actions: [['Put the old spelling back', (chosen, b) =>
      libraryRespellBack(chosen, b)]]
  });
  card.appendChild(more);
}


/* ---- contribSettled   index.html 48693-48718 ---- */
function contribSettled(card, auto, spelled, held, plan) {
  /* WHAT THE NEXT CHECK WILL DO belongs here too: it is a decision already
     reached, and reading it is optional in exactly the way the rest is. */
  const adds = plan ? plan.in.concat(plan.fill) : [];
  const outs = (plan && plan.out) || [];
  const n = auto.length + spelled.length + held.length + adds.length
    + outs.length;
  if (!n) return;
  const said = [];
  if (adds.length) said.push(adds.length + ' going in');
  if (outs.length) said.push(outs.length + ' dropping');
  if (auto.length) said.push(auto.length + ' went in');
  if (spelled.length) said.push(spelled.length + ' respelled');
  if (held.length) said.push(held.length + ' dropped');
  const more = el('details');
  more.style.marginTop = '9px';
  more.appendChild(el('summary', 'sub', n + ' settled without you \u2014 '

/* LOOK FIRST, THEN WRITE ONCE (BZ, 2026-09-15). The lookups for thin rows
   run inside the press and are merged before anything is written, then the
   lot lands in one update: nothing is asked twice, the library never holds
   the thin version, and nothing reads the whole library back to append.

   The lookups use the fill run's parse and writer (A.L.parseLookup,
   A.L.gapsClosed, A.L.libraryFillWrite) against the rows about to be written,
   so this path and that run cannot disagree (rule 30d). */

/* ---- contribAddMany   index.html 48886-48923 ---- */
async function contribAddMany(list, btn) {
  /* MOVED: index.html passed S.catalog here, so an offer was enriched from
     whatever the admin's own shelf knew about the same bottle. There is no
     shelf on this page, so an offer is written as it was offered. Nothing
     is lost: an admin's own facts reach the library the way everybody
     else's do, by being offered from the shelf page. */
  const w = A.L.intakeToWrite(list, LIB.removed, LIB.graves, null,
    Date.now(), false, LIB.products);
  w.refused.forEach(r => appLog('library: not adding ' + r.name + ' \u2014 '
    + r.why));
  const pending = w.pending;
  const thin = A.lookupUrl ? w.thin : [];
  if (!Object.keys(pending).length) {
    toast('Nothing added \u2014 all of them were judged before');
    return;
  }
  const done = btn ? buttonWorking(btn, thin.length
    ? 'Looking up ' + thin.length + ', then adding '
      + Object.keys(pending).length + '\u2026'
    : 'Adding ' + Object.keys(pending).length + '\u2026') : () => {};
  appLog('library: adding ' + Object.keys(pending).length + ', '
    + thin.length + ' of them short of something and looked up first');

/* DROPPING IS NOT DELETING. The offer keeps its place with the reason
   written on it, and goes on its own after a fortnight. It is NOT the
   library deletion - that one leaves a tombstone so the entry cannot come
   back, and an offer that was never accepted has nothing to come back
   from.
   AND IT SAYS WHAT ACTUALLY HAPPENED: each result is counted, each failure
   logged with its row, and the toast reports what succeeded. A swallowed
   refusal reporting success sends somebody looking anywhere but the write. */

/* ---- contribDropMany   index.html 48924-48976 ---- */
function contribDropMany(list, btn) {
  const done = btn ? buttonWorking(btn, 'Dropping ' + list.length + '\u2026')
    : () => {};
  appLog('library: dropping ' + list.length + ' offer(s), held '
    + A.L.INTAKE_HOLD_DAYS + ' days');
  const rows = list.map(x => x.row || x)
    .filter(r => r && r.uid && r.slug);
  if (rows.length < list.length) {
    appLog('library: ' + (list.length - rows.length) + ' of them have no '
      + 'node to drop \u2014 nothing to write');
  }
  Promise.all(list.map(x => {
    const r = x.row || x;
    if (!r || !r.uid || !r.slug) return Promise.resolve(false);
    /* THE KEY, not only the sentence. "already in as <name>" was written for a
       person to read and left the offerer's own bottle pointed at nothing the
       library knows - three times for one Weller (BZ, 2026-10-01: "I own weller
       antique 107 ... Hence it must be in the library"). With the key recorded,
       the offering device can subscribe itself. */
    const into = (x.near && (x.near._key || x.near.k)) ? A.L.libKey(x.near.name
      || x.near._key || x.near.k) : null;
    return contribRef().child(r.uid).child(r.slug).child('dropped')
      .set(Object.assign({ why: x.why || x.rule || 'nothing to add',
        at: Date.now() }, into ? { into: into } : {}))
      .then(() => true)
      .catch(e => {
        appLog('library: could NOT drop ' + (r.entry || {}).name
          + ' at contrib/' + r.uid + '/' + r.slug + ' \u2014 '
          + ((e && e.message) || e));
        return false;
      });
  })).then(got => {
    const ok = got.filter(Boolean).length;
    done();
    toast(A.L.intakeDroppedSay(ok, list.length));
    renderLibraryScreen();
    countOffers();
  });
}

   Browse it, search it, fix an entry, remove one, so a wrong entry is not
