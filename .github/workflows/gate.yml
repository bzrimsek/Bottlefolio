# THE CLOUD GATE.
#
# BZ, 2026-09-15: automation from build to deploy to git, and not local -
# we need to push this live when we go.
#
# push.py sends a finished build to the `build` branch as ONE commit. This
# runs the whole gate on GitHub's servers against that commit, and only a
# green gate deploys anything:
#
#   gate  ->  main not moved since the push  ->  Apps Script service and
#   Firebase rules (each only if its files changed)  ->  the site
#
# The service goes before the site, because a new page that needs a new
# service must never arrive first; if the service deploy or its check fails,
# main does not move. A red gate leaves everything live exactly as it was.
#
# THE SITE IS AN ARTIFACT, NOT THE REPOSITORY (review item 40, 2026-09-15).
# The eleven files the app actually reaches are packaged and handed to
# Pages; the 800KB changelog, the harnesses, the exports and the CSVs stay
# out of it. `main` still moves to every published build, because it is the
# record of what is live and the thing the next push is made on.

name: Gate and publish

on:
  push:
    branches: [build]
  workflow_dispatch:

# One build at a time, in order. A second push waits for the first rather
# than racing it to main.
concurrency:
  group: gate-and-publish
  cancel-in-progress: false

# READ-ONLY UNLESS A JOB SAYS OTHERWISE. Every job ran with all three write
# permissions, including the gate, which runs the whole test suite and its
# npm packages (scan, 2026-09-16). Each job now asks for only what it uses.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # fast-forward main to the gated build, and nothing else
      pages: read       # read how Pages is configured
    outputs:
      # Read once here and handed to the publish job, which has no checkout
      # and so cannot grep index.html for itself.
      version: ${{ steps.version.outputs.app }}
      pages_source: ${{ steps.pagessrc.outputs.build_type }}
    env:
      # The suite's dates are written for a UTC clock (§351 expects the
      # library export to read 2026-01-15 for midnight UTC). Pinned rather
      # than inherited, so a runner change cannot move a date by a day.
      TZ: UTC
    steps:
      - name: Check out this build
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # NOT LEFT IN .git/config for every later step to read. The only
          # step that writes to the repository is the last one, and it is
          # handed the token itself.
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright and eslint (exact versions from package.json)
        run: npm ci --no-audit --no-fund

      # THE BROWSER COMES FROM A CACHE. Downloading it took 20 of the run's
      # seconds on every push, for the same bytes each time (review item
      # 29, 2026-09-15). The browser build is fixed by the Playwright
      # version, so the cache is keyed on exactly that: the version npm ci
      # just installed, which is the exact one package.json pins, because
      # npm ci refuses a lock file that disagrees with it. A new Playwright
      # is a new key and a fresh download, never a stale browser.
      #
      # ONLY THE HEADLESS SHELL. Every harness that opens a browser -
      # browser.js, sync.js, screens.js, render.js and twotab.js - calls
      # chromium.launch() with no options, which is headless, and headless
      # Chromium in this Playwright is the separate chrome-headless-shell
      # build. Checked on 2026-09-15 by launching it that way and listing
      # the process that started. The full Chrome and FFmpeg were downloaded
      # on every run and never started.
      - name: Which Playwright is installed
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Chromium from the cache
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-headless-shell

      - name: Install Chromium for the browser checks (headless shell, with its system packages)
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      # The cache holds the browser, not the system packages it needs, and
      # every run starts on a fresh machine. So a cache hit still installs
      # them, which is the half of --with-deps the cache cannot supply.
      - name: Chromium's system packages (the browser came from the cache)
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium-headless-shell

      # BZ's real shelf. The suite will not start without it, and the repo is
      # public, so only the encrypted copies are committed. The key is the
      # SHELF_KEY secret; the unlocked files exist only on this runner and
      # vanish with it.
      - name: Unlock BZ's shelf files
        env:
          SHELF_KEY: ${{ secrets.SHELF_KEY }}
        run: |
          for f in bz-bottles.json bz-flights.json; do
            printf '%s' "$SHELF_KEY" | gpg --quiet --batch --yes \
              --pinentry-mode loopback --passphrase-fd 0 \
              --output "$f" --decrypt "$f.gpg"
          done

      # THE TIMING HISTORY (rule 35). gate.py expects each step to take the
      # median of its last nine runs, read from .gatetimes.json - and every
      # runner is a new machine, so every cloud run began with no record and
      # printed "no expectation yet" beside all ten. Restored from the
      # newest run's copy. A cache entry can never be overwritten, so each
      # run saves under a key of its own and restore-keys, a prefix, picks
      # the most recent one.
      - name: The gate's timing history, from the last run
        uses: actions/cache/restore@v4
        with:
          path: .gatetimes.json
          key: gatetimes-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gatetimes-

      # firebase-tools refuses any Java before 21; the runner's default is 17.
      - name: Java 21, for the rules emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The Firebase database emulator is a download of its own the first
      # time it runs; kept between runs like the browser.
      - name: The rules emulator, from the cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      # No number in this label. It said thirteen while gate.py ran
      # fifteen, and a count written in two places only ever drifts.
      - name: The gate - every check
        run: python3 gate.py

      # NO SCREENSHOTS LEAVE THE RUNNER. shots.js photographs every screen
      # with BZ's real shelf loaded, and this repo is PUBLIC - so the
      # `phone-screenshots` artifact that was uploaded here from 2026-09-15
      # published his bottle count, what the shelf is worth and its make-up
      # to anybody with a GitHub account, which is exactly what the sealed
      # shelf files exist to prevent. Found by the security scan on
      # 2026-09-16 and removed. The phone check still runs and still fails
      # the gate; the pictures stay on the runner and go with it.

      # Saved when the gate is red too, because gate.py records a failed
      # run's times as well; skipped only when gate.py never got as far as
      # writing the file. Saved here rather than at the end of the job, so a
      # deploy step failing later cannot lose the gate's record.
      - name: Keep the timing history for the next run
        if: always() && hashFiles('.gatetimes.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .gatetimes.json
          key: gatetimes-${{ github.run_id }}-${{ github.run_attempt }}

      # MAIN MUST NOT HAVE MOVED UNDER THIS BUILD. push.py makes each build
      # on main as it was at push time and force-moves `build` onto it, so
      # two pushes close together leave the second build sitting on a main
      # the first has since moved. That build can never publish - the
      # fast-forward at the end refuses it - but the service and rules
      # steps come first, so it could put its Apps Script and Firebase
      # rules live and then fail to move main: half a deploy. Checked here,
      # after the gate and before anything is deployed, so a stale build
      # stops while everything live still belongs to one build. push.py
      # refuses to push while a run is going, which stops most of these
      # before they start; this is the one that cannot be skipped.
      - name: Is this build still a fast-forward of main?
        run: |
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main moved to $(git rev-parse --short origin/main) after this build was made, so this build cannot publish. Nothing was deployed - the live service, rules and site are as they were. Push again from the current main: python push.py"
            exit 1
          fi
          echo "main $(git rev-parse --short origin/main) is an ancestor of this build - safe to deploy."

      # Compared against main, which is what is live right now, before main
      # moves. Only these five make up the live project - checked by cloning
      # it on 2026-09-15. lookup.gs is a second copy of Code.gs and
      # recap-handler.gs is not in the project; they stay in the repo and are
      # never sent, because either would define every function twice.
      - name: Did the Apps Script service change?
        id: gas
        run: |
          git fetch origin main --quiet
          files="Code.gs label.gs recap.gs shelf.gs apps-script/appsscript.json"
          if git diff --quiet origin/main HEAD -- $files; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Service files unchanged - the live service is left alone."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat origin/main HEAD -- $files
          fi

      # Same deployment, new version, so the URL the app calls never changes.
      # A paste is not a deploy (rule 25e): push alone would change nothing
      # the app can reach, so the redeploy is part of the same step.
      - name: Deploy the Apps Script service (same deployment, new version)
        if: steps.gas.outputs.changed == 'true'
        env:
          CLASPRC: ${{ secrets.CLASPRC }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          npm install -g @google/clasp@3.4.1 --no-audit --no-fund
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          dir=$(mktemp -d)
          cp Code.gs label.gs recap.gs shelf.gs apps-script/appsscript.json "$dir"/
          printf '{"scriptId":"%s","rootDir":"%s"}' "$GAS_SCRIPT_ID" "$dir" > "$dir/.clasp.json"
          ver=$(grep -m1 -oP "var GS_BUILD\s*=\s*'\K[^']+" Code.gs)
          cd "$dir"
          clasp push --force
          clasp update-deployment "$GAS_DEPLOYMENT_ID" -d "Bottlefolio service $ver"
          rm -f ~/.clasprc.json

      # The only proof the new code is what the app reaches: ask the live
      # deployment the same question the app's Check the service asks.
      - name: Confirm the live service reports the new build
        if: steps.gas.outputs.changed == 'true'
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          want=$(grep -m1 -oP "var GS_BUILD\s*=\s*'\K[^']+" Code.gs)
          for i in $(seq 1 12); do
            got=$(curl -sL -H 'Content-Type: text/plain' -d '{"mode":"version"}' \
              "https://script.google.com/macros/s/$GAS_DEPLOYMENT_ID/exec" \
              | grep -oP '"build"\s*:\s*"\K[^"]+' || true)
            echo "live service says ${got:-nothing}, this build is $want"
            if [ "$got" = "$want" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::The service was deployed but did not report build $want. main has NOT moved."
          exit 1

      # THE FIREBASE RULES, only when firebase-rules.json changed. rules.js
      # never writes the whole rules document from the file: it swaps in
      # this app's branch (bz-apps/whisky) and nothing else, refuses if the
      # live rules carry comments a rewrite would lose, and reads the result
      # back to prove the branch matches the file and nothing else moved.
      # Before the site, like the service: a page that needs a new rule must
      # not arrive before the rule does.
      - name: Did the Firebase rules change?
        id: rules
        run: |
          if git diff --quiet origin/main HEAD -- firebase-rules.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "firebase-rules.json unchanged - the live rules are left alone."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat origin/main HEAD -- firebase-rules.json
          fi

      - name: Deploy the Firebase rules (this app's branch only)
        if: steps.rules.outputs.changed == 'true'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node rules.js deploy

      - name: Which version is this build
        id: version
        run: |
          echo "app=$(grep -m1 -oP "const APP_VERSION\s*=\s*'\K[\d.]+" index.html)" >> "$GITHUB_OUTPUT"

      # HOW IS PAGES CONFIGURED RIGHT NOW? A read, never a write - this
      # workflow does not change the repository's settings.
      #
      #   build_type "legacy"   Pages builds the whole main branch itself
      #                         (Settings -> Pages -> Deploy from a branch)
      #   build_type "workflow" Pages serves what this run uploads
      #                         (Settings -> Pages -> GitHub Actions)
      #
      # Both are handled below, so the switch can be made on BZ's schedule
      # and a run in either state publishes the same site. Once it is
      # "workflow" for good, the legacy branch of the publish job and this
      # step go, and so does `contents: write`'s second purpose.
      - name: How is GitHub Pages configured
        id: pagessrc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "build_type=$t" >> "$GITHUB_OUTPUT"
          echo "Pages build_type is $t"

      # WHAT THE SITE ACTUALLY SERVES, AND NOTHING ELSE.
      #
      # Review item 40, 2026-09-15: legacy Pages ran Jekyll over the whole
      # repository on every push, twice per push, 44 to 92 seconds each.
      # Measured on main the same day: 74 files, 23.5MB, of which ten are
      # superseded lock copies of index.html at ~1.9MB apiece, plus the
      # 805KB CHANGELOG and the 970KB test suite. The artifact below is 12
      # files and 2.8MB. Nothing dropped is reachable from the app.
      #
      # This list is not a guess. It is every same-origin file index.html
      # and sw.js name, read out of both files on 2026-09-15:
      #   index.html   the app
      #   sw.js        registered at './sw.js'
      #   manifest.json, icon-192, icon-512, icon-mask-192, icon-mask-512
      #                the install; the manifest names all four icons and
      #                index.html's <link rel="icon"> names the first
      #   mark.png     the wordmark, two <img src> in index.html
      #   zxing.min.js the barcode decoder, loaded on demand
      #   data.json, map.json   fetched by the app, precached by sw.js
      # Every one of them is in sw.js's SHELL/EXTRAS/DATA lists, which is
      # the same question asked from the other side: a file the worker
      # precaches and the site does not serve is an install that 404s.
      #
      # The sealed shelf files are NOT here and never will be: `grep -c gpg`
      # is 0 in both index.html and sw.js, and the plain ones exist only on
      # this runner. The site has no use for either.
      #
      # .nojekyll because a Pages artifact is served as-is and Jekyll must
      # not be invited back in - it would eat any file or folder beginning
      # with an underscore.
      - name: The site, and only the site
        run: |
          mkdir -p site
          cp index.html sw.js manifest.json mark.png \
             icon-192.png icon-512.png icon-mask-192.png icon-mask-512.png \
             zxing.min.js data.json map.json site/
          touch site/.nojekyll
          echo "the artifact:"
          ls -la site
          du -sh site

      - name: Package the site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # LAST, AFTER THE ARTIFACT EXISTS. Everything above this line can fail
      # without changing anything live; below it, main is the record of what
      # is published. Packaging first is the same rule the service and the
      # rules follow - a step that could fail goes before the one that
      # commits, so a failure is never half a deploy.
      #
      # Fast-forward only. If somebody changed main by hand since push.py
      # read it, this refuses rather than overwriting their change, and the
      # run fails saying so.
      - name: Publish - move main to this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

  # THE PUBLISH. A job of its own because actions/deploy-pages requires the
  # github-pages environment, and an environment on the gate job would put
  # every gate run through the environment's rules rather than only the
  # deploy.
  #
  # It runs in both Pages modes and the live check at the end is the same
  # either way, so the only thing the setting changes is which of the two
  # middle steps fires. `needs: gate` means a red gate publishes nothing.
  # TWO PUBLISH JOBS, ONE PER PAGES SOURCE. A job takes its environment
  # unconditionally, and the github-pages environment is only grantable when
  # the Pages source IS GitHub Actions - so a single job with `environment:`
  # is refused outright while the source is a branch, before any step runs.
  # That is how v2.4.9 reached the live site with a red run.
  publish:
    needs: gate
    if: needs.gate.outputs.pages_source == 'workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write      # deploy the artifact
      id-token: write   # actions/deploy-pages signs its request with an OIDC token
      actions: read     # fetch the artifact the gate uploaded
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact (Pages source is GitHub Actions)
        id: deployment
        uses: actions/deploy-pages@v4

      # The only check that proves it is live: ask the real site which
      # version it is serving, past the CDN's cache, until it says ours.
      - name: Wait until the live site serves this version
        run: |
          want="${{ needs.gate.outputs.version }}"
          url="https://bzrimsek.github.io/Bottlefolio/index.html"
          for i in $(seq 1 120); do
            got=$(curl -fsSL "$url?nocache=$(date +%s%N)" \
              | grep -m1 -oP "const APP_VERSION\s*=\s*'\K[\d.]+" || true)
            echo "live site says v${got:-?}, this build is v$want"
            if [ "$got" = "$want" ]; then
              echo "LIVE: v$want at https://bzrimsek.github.io/Bottlefolio/"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The gate passed and main moved, but the site did not show v$want within 10 minutes."
          exit 1

  # UNTIL THE SETTING IS SWITCHED. Moving main already triggers a branch
  # build on its own; this asks for it explicitly so the wait has something
  # to wait for, and does not fail when Pages declines a second build it is
  # already running.
  publish-from-branch:
    needs: gate
    if: needs.gate.outputs.pages_source != 'workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write      # ask Pages to rebuild the branch
    steps:
      - name: Ask Pages to rebuild the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Pages build_type is '${{ needs.gate.outputs.pages_source }}', not 'workflow'."
          echo "Switch Settings -> Pages -> Source to GitHub Actions to publish the artifact instead."
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent \
            || echo "Pages refused the explicit request; the push to main normally triggers a build on its own."

      # The only check that proves it is live: ask the real site which
      # version it is serving, past the CDN's cache, until it says ours.
      - name: Wait until the live site serves this version
        run: |
          want="${{ needs.gate.outputs.version }}"
          url="https://bzrimsek.github.io/Bottlefolio/index.html"
          for i in $(seq 1 120); do
            got=$(curl -fsSL "$url?nocache=$(date +%s%N)" \
              | grep -m1 -oP "const APP_VERSION\s*=\s*'\K[\d.]+" || true)
            echo "live site says v${got:-?}, this build is v$want"
            if [ "$got" = "$want" ]; then
              echo "LIVE: v$want at https://bzrimsek.github.io/Bottlefolio/"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The gate passed and main moved, but the site did not show v$want within 10 minutes."
          exit 1
