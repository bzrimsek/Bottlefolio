# REFERENCE DATA, refreshed once a month (BZ, 2026-09-17).
#
# Wikidata's distilleries, TTB's permit list and the month of TTB label
# approvals that has just finished, shaped by the engine and loaded into
# shared/ref; library entries with an empty maker, country, category or
# style are filled from it (refdata.js, L.refFill). Nothing stated is ever
# overwritten.
#
# refcache/ is public government and Wikidata data. It is kept between runs
# as an artifact (90 days, so a monthly run always finds the last one), and
# only the missing months are asked for. With no artifact it reads fourteen
# years, which is slow and polite by design.
#
# It runs from main, which is what the gate published.
name: Reference data

on:
  schedule:
    - cron: '41 8 2 * *'     # the 2nd of every month, 08:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: refdata
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Last month's cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p refcache
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refdata.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$last" ] && gh run download "$last" --repo "$GITHUB_REPOSITORY" \
               --name refcache --dir refcache; then
            echo "restored $(ls refcache | wc -l) files from run $last"
          else
            echo "no earlier cache - reading every month"
          fi

      # TTB'S SERVER LEAVES OUT ITS MIDDLE CERTIFICATE (2026-09-17: "unable to
      # get local issuer certificate"). Windows fetches it on its own, Linux
      # does not. It is fetched from the address TTB's own certificate names,
      # and used only if it chains to a root this runner already trusts.
      - name: TTB's missing certificate
        run: |
          url=$(echo | openssl s_client -connect ttbonline.gov:443 -servername ttbonline.gov 2>/dev/null \
            | openssl x509 -noout -text | grep -o 'CA Issuers - URI:[^ ]*' | head -1 | sed 's/CA Issuers - URI://')
          echo "issuer certificate: $url"
          curl -sSfL --max-time 60 "$url" -o ttb-ca.der
          openssl x509 -inform DER -in ttb-ca.der -out ttb-ca.pem 2>/dev/null || cp ttb-ca.der ttb-ca.pem
          openssl verify ttb-ca.pem
          echo "NODE_EXTRA_CA_CERTS=$PWD/ttb-ca.pem" >> "$GITHUB_ENV"
          cat /etc/ssl/certs/ca-certificates.crt ttb-ca.pem > ttb-bundle.pem
          curl -sS -o /dev/null --max-time 60 --cacert ttb-bundle.pem \
            -w 'TTB answered HTTP %{http_code}\n' \
            https://ttbonline.gov/colasonline/publicSearchColasBasic.do || true

      - name: Fetch
        run: node refdata.js fetch

      - name: Keep the cache for next month
        uses: actions/upload-artifact@v4
        with:
          name: refcache
          path: refcache/
          retention-days: 90
          include-hidden-files: false

      - name: Load
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node refdata.js load
